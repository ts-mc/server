  tabprefix: "%luckperms-prefix%"
  tagprefix: "%luckperms-prefix%%fancyglow_color%"
  customtabname: "%player%"
  tabsuffix: "%animation:tag-default%"
  tagsuffix: "&7%condition:tag-default%"
