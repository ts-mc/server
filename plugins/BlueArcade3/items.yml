waiting_room_items:
  store:
    enabled: true
    material: EMERALD
    slot: 0
    display_name: "<green>Open the store</green>"
    actions:
      - PLAYER;/ba store

  vote:
    enabled: true
    material: DIAMOND
    slot: 1
    display_name: "<aqua>Vote for mini-games</aqua>"
    actions:
      - PLAYER;/ba vote

  team_select:
    enabled: true
    material: WHITE_BANNER
    slot: 7
    display_name: "<yellow>Select a team</yellow>"
    lore:
      - "<gray>Choose your team before the game starts.</gray>"
    actions:
      - PLAYER;/ba team

  leave:
    enabled: true
    material: RED_BED
    slot: 8
    display_name: "<red>Leave the game</red>"
    actions:
      - PLAYER;/ba leave

end_items:
  play_again:
    enabled: true
    material: SLIME_BALL
    slot: 0
    display_name: "<green>Play again</green>"
    actions:
      - PLAYER;/ba quickjoin

  view_stats:
    enabled: true
    material: BOOK
    slot: 4
    display_name: "<yellow>View all stats</yellow>"
    actions:
      - PLAYER;/ba stats

  exit_arena:
    enabled: true
    material: RED_BED
    slot: 8
    display_name: "<red>Leave the game</red>"
    actions:
      - PLAYER;/ba leave
