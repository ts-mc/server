main_lobby_items:
  # Slot 0 is the server hub menu (DeluxeMenus /tsmenu). Quickjoin and the game
  # selector are reachable from inside that menu, so this item no longer
  # duplicates them on the hotbar.
  menu:
    enabled: true
    material: COMPASS
    slot: 0
    display_name: "<gradient:#4CADD0:#B2F9FF><bold>Games Menu</bold></gradient>"
    lore:
      - "<gray>Open the server hub: play, store, vote,</gray>"
      - "<gray>stats and party — all in one place.</gray>"
      - ""
      - "<#FFEFC5>➥ Click to open</#FFEFC5>"
    actions:
      - PLAYER;/tsmenu
  maps:
    enabled: true
    material: BOOK
    slot: 1
    display_name: "{language:items.ui.main_lobby_items.maps.display_name}"
    lore:
      - "{language:items.ui.main_lobby_items.maps.lore}"
    actions:
      - PLAYER;/ba join
  stats:
    enabled: true
    material: PLAYER_HEAD
    value: "{player}"
    slot: 4
    display_name: "{language:items.ui.main_lobby_items.stats.display_name}"
    lore:
      - "{language:items.ui.main_lobby_items.stats.lore}"
    actions:
      - PLAYER;/ba stats
  party:
    enabled: true
    material: CAKE
    slot: 7
    display_name: "{language:items.ui.main_lobby_items.party.display_name}"
    lore:
      - "{language:items.ui.main_lobby_items.party.lore}"
    actions:
      - PLAYER;/ba party
  leave:
    enabled: true
    material: RED_BED
    slot: 8
    display_name: "{language:items.ui.main_lobby_items.leave.display_name}"
    lore:
      - "{language:items.ui.main_lobby_items.leave.lore}"
    actions:
      - "MESSAGE;{language:items.ui.main_lobby_items.leave.actions.message_0}"
  play:
    enabled: true
    material: EMERALD
    slot: 0
    display_name: "{language:items.ui.main_lobby_items.play.display_name}"
    lore:
      - "{language:items.ui.main_lobby_items.play.lore}"
    actions:
      - PLAYER;/ba quickjoin
