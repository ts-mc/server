      1:
        name: "First lap"
        description:
          - "Play your first race."
        conditions:
          - "{theysixevents_stat_module_race_games_played} >= 1"
        rewards:
          commands:
            - "arcadeadmin credits give {player} 10"
            - "arcadeadmin xp give {player} 10"
