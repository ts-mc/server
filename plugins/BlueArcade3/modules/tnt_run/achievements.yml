  sort_order: 26

achievements:
  run_rookie:
    name: "Run Rookie"
    description:
      - "Play TNT Run matches."
    icon: LEATHER_BOOTS
    phases:
      1:
        name: "First sprint"
        description:
          - "Play your first match."
        conditions:
          - "{theysixevents_stat_module_tnt_run_games_played} >= 1"
        rewards:
          commands:
            - "baa credits give {player} 10"
            - "baa xp give {player} 10"
