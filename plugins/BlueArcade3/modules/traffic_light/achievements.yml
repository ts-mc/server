file_version: 1
category:
  id: traffic_light
  name: "Traffic Light"
  description:
    - "Achievements tied to Traffic Light."
  icon: ROSE_BUSH
  sort_order: 10

achievements:
  rookie_runner:
    name: "Rookie Runner"
    description:
      - "Play your first Traffic Light games."
    icon: FEATHER
    phases:
      1:
        name: "First steps"
        description:
          - "Play your first Traffic Light game."
        conditions:
          - "{theysixevents_stat_module_traffic_light_games_played} >= 1"
        rewards:
          commands:
            - "arcadeadmin credits give {player} 10"
            - "arcadeadmin xp give {player} 10"
          messages:
            - "  <gold>⛁</gold> <yellow>+10 credits</yellow>"
            - "  <gold>✹</gold> <gold>+10 XP</gold>"
