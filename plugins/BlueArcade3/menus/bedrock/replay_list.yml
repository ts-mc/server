    actions:
      - PLAYER;/ba replay
  next:
    text: "{language:menus.common.bedrock.pagination.next}"
    image: "https://blueva.net/api/menu/items/1_21_10/minecraft_arrow.png"
    visibleIf: "{page_has_next}"
