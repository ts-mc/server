    actions:
      - "PLAYER;/ba replay {module_id} {replay_id}"
buttons:
  previous:
    text: "{language:menus.common.bedrock.pagination.previous}"
    image: "https://blueva.net/api/menu/items/1_21_10/minecraft_arrow.png"
