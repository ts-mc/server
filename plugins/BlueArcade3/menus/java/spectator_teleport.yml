dynamicItem:
  name: "{language:menus.spectator.teleport.java.dynamic.name}"
  itemStack:
    material: PLAYER_HEAD
    amount: 1
    value: "{target}"
  lore:
    - "{language:menus.spectator.teleport.java.dynamic.lore}"
  actions:
    - "SPECTATOR;TELEPORT_TARGET;{target_uuid}"
items:
  previous_page:
    slot: 45
    name: "{language:menus.common.java.pagination.previous.name}"
    visibleIf: "{page_has_previous}"
    itemStack:
      material: ARROW
      amount: 1
    lore:
      - "{language:menus.common.java.pagination.previous.lore}"
    actions:
      - "SPECTATOR;TELEPORT_PLAYER_PAGE;{page_previous}"
  close:
    slot: 49
    name: "{language:menus.common.actions.close.name}"
    itemStack:
      material: BARRIER
      amount: 1
    lore:
      - "{language:menus.common.actions.close.lore}"
    actions:
      - CLOSE
  next_page:
    slot: 53
    name: "{language:menus.common.java.pagination.next.name}"
    visibleIf: "{page_has_next}"
    itemStack:
      material: ARROW
      amount: 1
    lore:
      - "{language:menus.common.java.pagination.next.lore}"
    actions:
      - "SPECTATOR;TELEPORT_PLAYER_PAGE;{page_next}"
