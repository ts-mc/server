# Curated reusable Core menu language text.

menus:
  common:
    bedrock:
      pagination:
        previous: "<white>← Page {page_previous}</white>"
        next: "<white>Page {page_next} →</white>"
      actions:
        back_to_categories: "<white>← Back to categories</white>"
        back_to_achievements: "<white>← Back to achievements</white>"
    java:
      pagination:
        previous:
          name: "<gray>← Page {page_previous}"
          lore:
            - "<gray>Go to the previous page.</gray>"
        next:
          name: "<gray>Page {page_next} →"
          lore:
            - "<gray>Go to the next page.</gray>"
    actions:
      close:
        name: "<red>Close</red>"
        lore:
          - "<gray>Return to the game.</gray>"
      back:
        name: "<red>Back</red>"
