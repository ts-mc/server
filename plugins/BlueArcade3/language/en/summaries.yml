summary:
  mini_game:
    - "{wide_line_separator}"
    - " "
    - "     <green>➀ <bold>{place_1}</green> <gray>✯ +3</gray>"
    - "     <gold>➁ <bold>{place_2}</gold> <gray>✯ +2</gray>"
    - "     <red>➂ <bold>{place_3}</red> <gray>✯ +1</gray>"
    - " "
    - "  <gold>⛁</gold> <yellow>{credits_earned}  <gray>|</gray>  <dark_purple>✹</dark_purple> <light_purple>{xp_earned}</light_purple>  <gray>|</gray>  <gold>✯</gold> <yellow>{stars_earned}  <gray>|</gray>  <green>Your place:</green> <gold>{place_player}</gold>"
    - " "
    - "{wide_line_separator}"
  mini_game_team:
    - "{wide_line_separator}"
    - " "
    - "  <green>Winning team:</green> <yellow>{team_winners}</yellow>"
    - "  <gray>Your team:</gray> <white>{team_player}</white> <gray>({team_player_count}/{team_size})</gray>"
    - " "
    - "  <gold>⛁</gold> <yellow>{credits_earned}  <gray>|</gray>  <dark_purple>✹</dark_purple> <light_purple>{xp_earned}</light_purple>  <gray>|</gray>  <gold>✯</gold> <yellow>{stars_earned}</yellow>"
    - " "
    - "{wide_line_separator}"
  final:
    - "{wide_line_separator}"
    - " "
    - "  <bold><gradient:{color_primary}:{color_secondary}>{server_name}</gradient></bold> <gray>-</gray> <yellow>End of Game <gray>-</gray> <green>Results:</green>"
    - " "
    - "     <green>➊ <bold>{place_1_stars}</green>"
    - "     <gold>➋ <bold>{place_2_stars}</gold>"
    - "     <red>➌ <bold>{place_3_stars}</red>"
    - " "
    - "  <gold>⛁</gold> <yellow>{credits_earned}  <gray>|</gray>  <dark_purple>✹</dark_purple> <light_purple>{xp_earned}</light_purple>  <gray>|</gray>  <gold>✯</gold> <yellow>{stars_earned}  <gray>|</gray>  <green>You placed:</green> <gold>{place_player}</gold>"
    - " "
    - "{wide_line_separator}"
  final_team:
    - "{wide_line_separator}"
    - " "
    - "  <bold><gradient:{color_primary}:{color_secondary}>{server_name}</gradient></bold> <gray>-</gray> <yellow>Team Results</yellow>"
    - " "
    - "  <green>Winning team:</green> <yellow>{team_winners}</yellow>"
    - "  <gray>Your team:</gray> <white>{team_player}</white> <gray>({team_player_count}/{team_size})</gray>"
    - " "
    - "  <gold>⛁</gold> <yellow>{credits_earned}  <gray>|</gray>  <dark_purple>✹</dark_purple> <light_purple>{xp_earned}</light_purple>  <gray>|</gray>  <gold>✯</gold> <yellow>{stars_earned}</yellow>"
    - " "
    - "{wide_line_separator}"
  final_standalone:
    - "{wide_line_separator}"
    - " "
    - "  <bold><gradient:{color_primary}:{color_secondary}>{server_name}</gradient></bold> <gray>-</gray> <yellow>Results</yellow>"
    - " "
    - "     <green>➊ <bold>{place_1}</green>"
    - "     <gold>➋ <bold>{place_2}</gold>"
    - "     <red>➌ <bold>{place_3}</red>"
    - " "
    - "  <gold>⛁</gold> <yellow>{credits_earned}  <gray>|</gray>  <dark_purple>✹</dark_purple> <light_purple>{xp_earned}</light_purple>  <gray>|</gray>  <green>You placed:</green> <gold>{place_player}</gold>"
    - " "
    - "{wide_line_separator}"
  java_summary_actions:
    - "{wide_line_separator}"
    - "<gray> </gray>"
    - "<gray>   </gray><click:run_command:'{play_again_command}'><green><bold>Play Again</bold></green></click> <gray> - </gray> <click:run_command:'{leave_command}'><red><bold>Leave</bold></red></click> <gray> - </gray> <click:run_command:'/ba achievements progress'><yellow><bold>View Progress</bold></yellow></click>"
    - "<gray> </gray>"
    - "{wide_line_separator}"
  stats:
    java:
      header:
        - "{wide_line_separator}"
        - " "
        - "  <bold><gradient:{color_primary}:{color_secondary}>{server_name}</gradient></bold> <gray>-</gray> <yellow>Stats Progress</yellow>"
        - " "
      entry: "    <gray>• {stat}</gray> <white>+{delta}</white> <dark_gray>(Total: {total})"
      module_entry: "    <gray>•</gray> <yellow>[{module}]</yellow> <white>{stat}</white> <green>+{delta}</green> <dark_gray>(Total: {total})"
      footer:
        - " "
        - "{wide_line_separator}"
    bedrock:
      title: Stat progress
      content_header: "Stats gained this match:"
      entry: "• {stat}: +{delta} (Total: {total})"
      empty: No new stats this round.
      buttons:
        play_again: Play again
        lobby: Return to Lobby
    invalid_period: "{prefix} <yellow>Invalid summary stats period '{period}'. Using all-time.</yellow>"
  replay_recorded:
    - "{wide_line_separator}"
    - "<gray> </gray>"
    - "<gray>   </gray><green>This match has been recorded.</green>"
    - "<gray>   </gray><click:run_command:'/ba replay {module_id} {replay_id}'><gold><bold>Click here</bold></gold></click> <gray>to watch the replay.</gray>"
    - "<gray> </gray>"
    - "{wide_line_separator}"
