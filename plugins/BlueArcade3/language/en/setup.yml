admin_commands:
  setup:
    bossbar_lobby: "<gradient:#f7971e:#ffd200>✦ Setup Mode</gradient> <dark_gray>»</dark_gray> <gold>Arena <white><bold>{arena_id}</bold></white></gold> <dark_gray>|</dark_gray> <yellow>🏛 Lobby</yellow>"
    bossbar_game: "<gradient:#00c6ff:#0072ff>✦ Setup Mode</gradient> <dark_gray>»</dark_gray> <aqua>Arena <white><bold>{arena_id}</bold></white></aqua> <dark_gray>|</dark_gray> <bold><white>🎮 {game}</white></bold>"
    bossbar_pending_enable: "<gradient:#56ab2f:#a8e063>✔ Arena <bold>{arena_id}</bold> is ready!</gradient> <dark_gray>»</dark_gray> <white>Run <green><bold>/baa enable {arena_id}</bold></green> to launch</white>"
    scoreboard:
      title: "<bold><gradient:{color_primary}:{color_secondary}>{server_name}</gradient></bold>"
      blank: ""
      arena: "<white>Setup:</white> <aqua>Arena {arena_id}</aqua>"
      phase: "<white>Phase:</white> <light_purple>{phase}</light_purple>"
      common_header: "<aqua><bold>Arena</bold></aqua>"
      game_header: "<light_purple><bold>{game}</bold></light_purple>"
      footer: "<yellow>{server_website}</yellow>"
      formats:
        done: "<green>✓</green> <white>{label}:</white> <aqua>{value}</aqua>"
        required: "<red>✗</red> <white>{label}:</white> <gray>{value}</gray>"
        optional: "<yellow>•</yellow> <white>{label}:</white> <gray>{value}</gray>"
      labels:
        name: Name
        min_players: Min players
        max_players: Max players
        lobby: Lobby
        games: Games
        bounds: Bounds
        spawns: Spawns
        time: Time
      values:
        text: Text
        number: Number
        location_type: Location
        skipped: Skipped
        bounds_type: Pos1 / Pos2
        locations_type: Locations
        seconds_type: Seconds
        add_game: Add a game
        phase_lobby: Lobby
        phase_game: Game
        location: "{x} {y} {z}"
        bounds: "{x}x{y}x{z}"
        spawns: "{count} set"
        time: "{time}s"
        games: "{count} configured"
        configured: Configured
        custom_required: Required
    lobby_setup_started: "{prefix} <green>Temporal lobby world created. Build the lobby, then run <white>/baa arena {arena_id} setlobby</white> to save your position.</green>"
    lobby_saved: "{prefix} <green>Lobby position saved! Now add a minigame with <white>/baa game {arena_id} add</white>.</green>"
    lobby_skipped: "{prefix} <yellow>Lobby skipped. Configure the waiting area inside the minigame world, then set it with /baa arena {arena_id} setlobby.</yellow>"
    saving_lobby: "{prefix} <yellow>Saving lobby world, please wait...</yellow>"
    game_setup_started: "{prefix} <green>Temporal world created for <white>{game}</white>. Build the map and enable it with <white>/baa game {arena_id} {game} enable</white>.</green>"
    saving_game: "{prefix} <yellow>Saving {game} world, please wait...</yellow>"
    world_save_completed: "{prefix} <green>World <white>{world}</white> saved to disk.</green>"
    game_saved: "{prefix} <green>Minigame <white>{game}</white> saved and enabled! Add more games with /baa game {arena_id} add, or enable the arena with <white>/baa enable {arena_id}</white>.</green>"
    edit_started: "{prefix} <green>Editing mode opened for arena {arena_id} lobby. Use <white>/baa arena {arena_id} setlobby</white> when done, then re-enable with /baa enable {arena_id}.</green>"
    game_edit_started: "{prefix} <green>Editing mode opened for <white>{game}</white> in arena {arena_id}. Use <white>/baa game {arena_id} {game} enable</white> when done.</green>"
    already_editing: "{prefix} <red>You are already editing an arena. Finish the current setup, save your progress with /baa arena <id> save (or /baa game <id> <game> save), or enable the arena.</red>"
    arena_already_being_edited: "{prefix} <red>Arena {arena_id} is already being edited by another admin.</red>"
    arena_not_dynamic: "{prefix} <red>This command is only available for dynamic arenas.</red>"
    lobby_zip_not_found: "{prefix} <red>Cannot edit lobby for arena {arena_id}: no lobby template found. Create and configure the arena first.</red>"
    game_zip_not_found: "{prefix} <red>Cannot edit <white>{game}</white> in arena {arena_id}: no template found. Add the game with /baa game {arena_id} add and configure it first.</red>"
    world_creation_failed: "{prefix} <red>Failed to create the temporal world. Check the console for details.</red>"
    cannot_exit_world: "{prefix} <red>You cannot leave this world while editing the arena. Finish the current setup step, or save your progress and exit with /baa arena <id> save (lobby) / /baa game <id> <game> save (map).</red>"
    no_active_lobby_session: "{prefix} <red>You are not currently setting up this arena's lobby. If you are editing a game map, use <white>/baa game <id> <game> save</white> instead.</red>"
    no_active_game_session: "{prefix} <red>You are not currently setting up <white>{game}</white> for this arena. If you are editing the lobby, use <white>/baa arena <id> save</white> instead.</red>"
    lobby_saved_exit: "{prefix} <green>Lobby setup progress saved. Resume anytime with <white>/baa arena {arena_id} edit</white>, or add a game with <white>/baa game {arena_id} add</white>.</green>"
    game_saved_exit: "{prefix} <green>Progress for <white>{game}</white> saved. Resume anytime with <white>/baa game {arena_id} {game} edit</white>, or enable it when ready with <white>/baa game {arena_id} {game} enable</white>.</green>"
