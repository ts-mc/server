# Curated reusable Core menu language text.

menus:
  achievements:
    categories:
      bedrock:
        title: "<gradient:{color_primary}:{color_secondary}><bold>{server_name}</bold></gradient> <gray>-</gray> <yellow>Achievements</yellow> <gray>({page}/{page_total})</gray>"
        content:
          - "<white>Select an achievements category.</white>"
          - "<white>Categories:</white> <white>{category_total}</white>"
          - "<white>Page:</white> <white>{page}</white>/<white>{page_total}</white>"
        templates:
          category:
            text: "<aqua>{category_name}</aqua> <white>({category_progress})</white>"
          empty:
            text: "<white>No achievements available.</white>"
      java:
        title: "<gradient:{color_primary}:{color_secondary}><bold>{server_name}</bold></gradient> <gray>-</gray> <yellow>Achievements</yellow> <gray>({page}/{page_total})</gray>"
        templates:
          category:
            name: "<aqua>{category_name}</aqua>"
            lore:
              - "<gray>{category_description}</gray>"
              - "<gray>Achievements:</gray> <white>{category_achievement_total}</white>"
              - "<gray>Completed:</gray> <white>{category_progress}</white>"
        empty:
          name: "<dark_gray>No category</dark_gray>"
          lore:
            - "<gray>No achievements to show yet.</gray>"
        items:
          info:
            name: "<aqua>Achievements</aqua>"
            lore:
              - "<gray>Categories:</gray> <white>{category_total}</white>"
              - "<gray>Page:</gray> <white>{page}</white>/<white>{page_total}</white>"
    list:
      bedrock:
        title: "<gradient:{color_primary}:{color_secondary}><bold>{server_name}</bold></gradient> <gray>-</gray> <yellow>{category_name}</yellow> <gray>({page}/{page_total})</gray>"
        content:
          - "<white>{category_description}</white>"
          - "<white>Completed:</white> <white>{achievement_completed}</white>/<white>{achievement_total}</white>"
          - "<white>Page:</white> <white>{page}</white>/<white>{page_total}</white>"
        templates:
          achievement:
            text: "<aqua>{achievement_name}</aqua> <white>- {achievement_status}</white> <white>({achievement_phase}/{achievement_phase_total})</white>"
          empty:
            text: "<white>No achievements found.</white>"
      java:
        title: "<gradient:{color_primary}:{color_secondary}><bold>{server_name}</bold></gradient> <gray>-</gray> <yellow>{category_name}</yellow> <gray>({page}/{page_total})</gray>"
        templates:
          achievement:
            name: "<aqua>{achievement_name}</aqua>"
            lore:
              - "<gray>{achievement_description}</gray>"
              - "<gray>Status:</gray> <white>{achievement_status}</white>"
              - "<gray>Phase:</gray> <white>{achievement_phase}</white>/<white>{achievement_phase_total}</white>"
              - "<gray>Progress:</gray> <white>{achievement_progress}</white>"
              - "<gray>{achievement_phase_name}</gray>"
              - "<gray>Click to view phases.</gray>"
        empty:
          name: "<dark_gray>No achievement</dark_gray>"
          lore:
            - "<gray>Keep playing to unlock more.</gray>"
        items:
          info:
            name: "<aqua>{category_name}</aqua>"
            lore:
              - "<gray>Achievements:</gray> <white>{achievement_total}</white>"
              - "<gray>Completed:</gray> <white>{achievement_completed}</white>"
              - "<gray>Page:</gray> <white>{page}</white>/<white>{page_total}</white>"
          back:
            name: "<gray>← Categories</gray>"
            lore:
              - "<gray>Back to categories.</gray>"
    phases:
      bedrock:
        title: "<gradient:{color_primary}:{color_secondary}><bold>{server_name}</bold></gradient> <gray>-</gray> <yellow>{achievement_name}</yellow> <gray>({page}/{page_total})</gray>"
        content:
          - "<white>{achievement_description}</white>"
          - "<white>Progress:</white> <white>{achievement_progress_bar}</white> <white>({achievement_progress})</white>"
          - "<white>Remaining:</white> <white>{achievement_remaining_bar}</white> <white>({achievement_remaining})</white>"
          - "<white>Page:</white> <white>{page}</white>/<white>{page_total}</white>"
        templates:
          phase:
            text: "<aqua>Phase {phase_index}</aqua> <white>- {phase_status}</white>"
          empty:
            text: "<white>No phases found.</white>"
      java:
        title: "<gradient:{color_primary}:{color_secondary}><bold>{server_name}</bold></gradient> <gray>-</gray> <yellow>{achievement_name}</yellow> <gray>({page}/{page_total})</gray>"
        templates:
          phase:
            name: "<aqua>Phase {phase_index}:</aqua> <white>{phase_name}</white>"
            lore:
              - "<gray>{phase_description}</gray>"
              - "<gray> </gray>"
              - "<gray>Status:</gray> <white>{phase_status}</white>"
              - "<gray>Progress:</gray> {achievement_progress_bar} <gray>({achievement_progress})</gray>"
              - "<gray>Remaining:</gray> {achievement_remaining_bar} <gray>({achievement_remaining})</gray>"
        empty:
          name: "<dark_gray>No phases</dark_gray>"
          lore:
            - "<gray>This achievement has no phases.</gray>"
        items:
          info:
            name: "<aqua>{achievement_name}</aqua>"
            lore:
              - "<gray>{achievement_description}</gray>"
              - "<gray> </gray>"
              - "<gray>Progress:</gray> {achievement_progress_bar} <gray>({achievement_progress})</gray>"
              - "<gray>Remaining:</gray> {achievement_remaining_bar} <gray>({achievement_remaining})</gray>"
              - "<gray>Page:</gray> <white>{page}</white>/<white>{page_total}</white>"
          back:
            name: "<gray>← Achievements</gray>"
            lore:
              - "<gray>Back to achievements.</gray>"
