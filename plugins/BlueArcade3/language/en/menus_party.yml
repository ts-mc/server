      bedrock:
        title: "<aqua>Party menu</aqua>"
        content:
          - "<white>Find a public party or start your own.</white>"
        buttons:
          search_public:
            text: "<yellow>Browse public parties</yellow>"
          create_party:
            text: "<aqua>Create a party</aqua>"
