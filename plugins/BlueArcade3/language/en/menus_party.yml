              - "<gray>Current:</gray> <white>{party_type}</white>"
              - "<gold>Left click:</gold> <white>Public</white>"
              - "<gold>Right click:</gold> <white>Private</white>"
              - "<dark_gray>Command:</dark_gray> <white>/ts party type <mode></white>"
          invite:
            name: "<green>Invite players</green>"
            lore:
              - "<gray>Send an invite to anyone online.</gray>"
              - "<dark_gray>Command:</dark_gray> <white>/ts party invite</white>"
          leave:
            lore:
              - "<gray>You will promote another member automatically.</gray>"
              - "<dark_gray>Command:</dark_gray> <white>/ts party leave</white>"
