        title: "<aqua>Your party <gray>({party_size} players)</gray>"
        items:
          info:
            name: "<yellow>Party overview</yellow>"
            lore:
              - "<gray>Leader:</gray> <white>{party_leader}</white>"
              - "<gray>Type:</gray> <white>{party_type}</white>"
              - "<gray>Players:</gray> <white>{party_size}</white>"
          members:
            lore:
              - "<gray>View members and manage roles.</gray>"
              - "<dark_gray>Command:</dark_gray> <white>/ts party members</white>"
