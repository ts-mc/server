# Curated reusable Core menu language text.

menus:
  party:
    invite:
      bedrock:
        title: "<aqua>Invite players <gray>(Page {page}/{page_total})</gray>"
        content:
          - "<white>Leader:</white> <white>{party_leader}</white>"
          - "<white>Privacy:</white> <white>{party_type}</white>"
          - "<white>Players:</white> <white>{party_size}</white>"
          - "<white>Page:</white> <white>{page}</white>/<white>{page_total}</white>"
        templates:
          dynamic:
            text: "<yellow>{player}</yellow>"
          empty:
            text: "<white>No players to invite.</white>"
      java:
        title: "<aqua>Invite players <gray>(Page {page}/{page_total})</gray>"
        dynamic:
          name: "<aqua>{player}</aqua>"
          lore:
            - "<gray>Click to invite this player.</gray>"
            - "<dark_gray>Command:</dark_gray> <white>/ts party invite {player}</white>"
        empty:
          name: "<dark_gray>No players found</dark_gray>"
          lore:
            - "<gray>Everyone online is already in a party.</gray>"
        items:
          info_item:
            name: "<aqua>Party</aqua>"
            lore:
              - "<gray>Leader:</gray> <white>{party_leader}</white>"
              - "<gray>Type:</gray> <white>{party_type}</white>"
              - "<gray>Players:</gray> <white>{party_size}</white>"
    leader:
      bedrock:
        title: "<aqua>Your party <gray>({party_size} players)</gray>"
        content:
          - "<white>Leader:</white> <white>{party_leader}</white>"
          - "<white>Privacy:</white> <white>{party_type}</white>"
          - "<white>Players:</white> <white>{party_size}</white>"
