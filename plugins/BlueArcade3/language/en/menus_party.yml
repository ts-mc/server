            text: "<white>No public parties.</white>"
      java:
        title: "<aqua>Public parties</aqua>"
        dynamic:
          name: "<yellow>{party_leader}</yellow>"
          lore:
            - "<gray>Privacy:</gray> <white>{party_type}</white>"
