# Curated reusable Core menu language text.

menus:
  store:
    categories:
      bedrock:
        title: "<aqua>Store</aqua>"
        content:
          - "<white>Browse store categories.</white>"
          - "<white>Categories:</white> <yellow>{total_categories}</yellow>"
          - "<white>Balance:</white> <yellow>{balance} {currency}</yellow>"
          - "<yellow>Page:</yellow> <white>{page}</white>/<white>{page_total}</white>"
        templates:
          category:
            text: "<green>{category_name}</green> <yellow>({category_owned_count}/{category_item_count})</yellow>"
          empty:
            text: "<white>No category available.</white>"
      java:
        title: "<aqua>Store</aqua>"
        templates:
          category:
            name: "<green>{category_name}</green>"
            lore:
              - "{category_description_multiline}"
              - "<gray> </gray>"
              - "<yellow>Progress</yellow>"
              - "<gray>• Items:</gray> <white>{category_item_count}</white>"
              - "<gray>• Owned:</gray> <white>{category_owned_count}</white>"
              - "{category_selection_line}"
              - "<gray> </gray>"
              - "<gold>Click to browse.</gold>"
        empty:
          name: "<dark_gray>No category</dark_gray>"
          lore:
            - "<gray>This slot is empty.</gray>"
        items:
          info:
            name: "<aqua>Store</aqua>"
            lore:
              - "<gray>Categories:</gray> <white>{total_categories}</white>"
              - "<gray>Balance:</gray> <white>{balance} {currency}</white>"
              - "<gray>Page:</gray> <white>{page}/{page_total}</white>"
    item_detail:
      bedrock:
        title: "<aqua>{category_name}</aqua>"
        content:
          - "<yellow>{item_name}</yellow>"
          - "{item_description}"
          - "<white>Status:</white> <yellow>{item_status}</yellow>"
          - "<white>Price:</white> <yellow>{item_price} {currency}</yellow>"
          - "{item_action_hint}"
        buttons:
          button1:
            text: "{item_primary_label}"
          button2:
            text: "<white>Back</white>"
    items:
      bedrock:
        title: "<aqua>{category_name}</aqua>"
        content:
          - "<white>Balance:</white> <yellow>{balance} {currency}</yellow>"
          - "<white>Items:</white> <yellow>{total_items}</yellow>"
          - "<yellow>Page:</yellow> <white>{page}</white>/<white>{page_total}</white>"
          - "<aqua>Tap an item to view details.</aqua>"
        templates:
          item:
            text: "<green>{item_name}</green> <yellow>({item_status})</yellow> <white>- {item_price} {currency}</white>"
          empty:
            text: "<white>No items available.</white>"
      java:
        title: "<aqua>{category_name} <gray>(Page {page}/{page_total})</gray>"
        templates:
          item:
            name: "<green>{item_name}</green>"
            lore:
              - "<gray>Description:</gray>"
              - "<dark_gray>{item_description}</dark_gray>"
              - "<gray> </gray>"
              - "<yellow>Details</yellow>"
              - "<gray>• Status:</gray> <white>{item_status}</white>"
              - "<gray>• Price:</gray> <white>{item_price} {currency}</white>"
              - "<gray> </gray>"
              - "{item_action_hint}"
        empty:
          name: "<dark_gray>No item</dark_gray>"
          lore:
            - "<gray>This slot is empty.</gray>"
        items:
          info:
            name: "<aqua>{category_name}</aqua>"
            lore:
              - "<gray>Items:</gray> <white>{total_items}</white>"
              - "<gray>Balance:</gray> <white>{balance} {currency}</white>"
              - "<gray>Page:</gray> <white>{page}/{page_total}</white>"
          back:
            name: "<gray>← Back to categories"
            lore:
              - "<gray>Return to the store.</gray>"
    purchase_confirmation:
      bedrock:
        title: "<red>Confirm Purchase</red>"
        content:
          - "<white>Item:</white> <yellow>{item_name}</yellow>"
          - "<white>Price:</white> <yellow>{item_price} {currency}</yellow>"
          - "<white>Balance:</white> <yellow>{balance} {currency}</yellow>"
          - "<yellow>Do you want to buy this item?</yellow>"
        buttons:
          button1:
            text: "<red>Cancel</red>"
          button2:
            text: "<green>Buy</green>"
      java:
        title: "<red>Confirm Purchase</red>"
        items:
          cancel:
            name: "<red>Cancel</red>"
            lore:
              - "<gray>Return to the store.</gray>"
          item:
            name: "<green>{item_name}</green>"
            lore:
              - "<gray>Price:</gray> <white>{item_price} {currency}</white>"
              - "<gray>Balance:</gray> <white>{balance} {currency}</white>"
          confirm:
            name: "<green>Buy</green>"
            lore:
              - "<gray>Purchase this item.</gray>"
    result_message:
      bedrock:
        title: "<aqua>Store</aqua>"
        content:
          - "{result_title}"
          - "{result_message}"
          - "<white>Item:</white> <yellow>{item_name}</yellow>"
          - "<white>Balance:</white> <yellow>{balance} {currency}</yellow>"
        buttons:
          button1:
            text: "<white>Back</white>"
          button2:
            text: "<green>Close</green>"
