server:
  name: TheySix Events
  website: www.blueva.net
colors:
  primary: aqua
  secondary: light_purple
  accent: yellow
  success: green
  warning: yellow
  error: red
  muted: gray
  dark: dark_gray
lines:
  separator: "<dark_gray><strikethrough>--------------------------</dark_gray><reset>"
  wide_separator: "<dark_gray><strikethrough>----------------------------------------------</dark_gray><reset>"
# ____  _               _                      _
# | __ )| |_   _  ___   / \   _ __ ___ __ _  __| | ___
# |  _ \| | | | |/ _ \ / _ \ | '__/ __/ _` |/ _` |/ _ \
# | |_) | | |_| |  __// ___ \| | | (_| (_| | (_| |  __/
# |____/|_|\__,_|\___/_/   \_|_|  \___\__,_|\__,_|\___|
