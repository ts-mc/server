# Shared language metadata, branding, colors, and reusable style placeholders.

language: English (UK)
prefix: "<bold><gradient:{color_primary}:{color_secondary}>{server_name}</gradient></bold> <gray>»</gray>"
plugin_info:
  - "{line_separator}"
  - " "
  - "<bold><gradient:{color_primary}:{color_secondary}>{server_name}</gradient> <gray>-</gray> <yellow>{plugin_version}</yellow>"
  - "<gray>Created by Blueva ({server_website})</gray>"
  - " "
  - "<gray>Use</gray> <light_purple>/ba help</light_purple> <gray>to get help.</gray>"
  - " "
  - "{line_separator}"
