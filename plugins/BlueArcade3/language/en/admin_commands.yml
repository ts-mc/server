      - "  <light_purple>/baa arena <id> setname <name></light_purple> <dark_gray>-</dark_gray> <gray>Set name</gray>"
      - "  <light_purple>/baa arena <id> setmode <mode></light_purple> <dark_gray>-</dark_gray> <gray>Change mode</gray>"
      - "  <light_purple>/baa arena <id> setrounds <n></light_purple> <dark_gray>-</dark_gray> <gray>Set rounds (party)</gray>"
      - "  <light_purple>/baa arena <id> minplayers/maxplayers <n></light_purple> <dark_gray>-</dark_gray> <gray>Set players</gray>"
