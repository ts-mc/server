      - "  <light_purple>/baa forcestop <id></light_purple> <dark_gray>-</dark_gray> <gray>Force stop arena</gray>"
      - "  <light_purple>/baa goto <id> <game></light_purple> <dark_gray>-</dark_gray> <gray>Teleport to game</gray>"
      - "  <light_purple>/baa teleport <player> <id></light_purple> <dark_gray>-</dark_gray> <gray>TP player to arena</gray>"
      - "  <light_purple>/baa module <action> <module></light_purple> <dark_gray>-</dark_gray> <gray>Manage modules</gray>"
