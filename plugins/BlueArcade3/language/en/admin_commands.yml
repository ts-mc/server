      - "  <light_purple>/baa enable <id></light_purple> <dark_gray>-</dark_gray> <gray>Enable arena</gray>"
      - "  <light_purple>/baa disable <id></light_purple> <dark_gray>-</dark_gray> <gray>Disable arena</gray>"
      - "  <light_purple>/baa list</light_purple> <dark_gray>-</dark_gray> <gray>List all arenas</gray>"
      - "  <light_purple>/baa info <id></light_purple> <dark_gray>-</dark_gray> <gray>Arena information</gray>"
      - " "
