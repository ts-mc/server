        item: " <aqua>{name}</aqua> <dark_gray>(id: <white>{id}</white>, page <white>#{resource_id}</white>)</dark_gray> <green>v{version}</green> <gray>|</gray> <gold>{downloads}</gold> <gray>downloads</gray> <gray>|</gray> <light_purple>{rating}</light_purple> <gray>rating</gray> <gray>|</gray> <white>{compatibility}</white> <dark_gray>-</dark_gray> <gray>{description}</gray>"
