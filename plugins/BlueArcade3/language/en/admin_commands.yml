      - "  <light_purple>/baa pos1</light_purple> <dark_gray>-</dark_gray> <gray>Set position 1</gray>"
      - "  <light_purple>/baa pos2</light_purple> <dark_gray>-</dark_gray> <gray>Set position 2</gray>"
      - "  <light_purple>/baa clearselection</light_purple> <dark_gray>-</dark_gray> <gray>Clear selection</gray>"
      - " "
      - " <yellow><bold>Arena Configuration:</bold></yellow>"
