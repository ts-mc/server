scoreboards:
  main_lobby:
    title: "<bold><gradient:{color_primary}:{color_secondary}>{server_name}</gradient></bold>"
    list:
      - ""
      - "<white>Name:</white> <aqua>{player_name}</aqua>"
      - "<white>Ping:</white> <aqua>{player_ping}ms</aqua>"
      - ""
      - "<white>Wins:</white> <aqua>{stat_global_wins}</aqua>"
      - "<white>Kills:</white> <aqua>{stat_global_kills}</aqua>"
      - "<white>Deaths:</white> <aqua>{stat_global_deaths}</aqua>"
      - "<white>Stars:</white> <aqua>{stat_global_stars}</aqua>"
      - "<white>Credits:</white> <aqua>{credits}</aqua>"
      - ""
      - "<yellow>{server_website}</yellow>"
  lobby:
    waiting:
      title: "<bold><gradient:{color_primary}:{color_secondary}>{server_name}</gradient>"
      list:
        - ""
        - "<white>Arena: <aqua>{arena}"
        - "<white>Players: <aqua>{players}<gray>/<aqua>{max_players}"
        - ""
        - "<aqua>Waiting..."
        - ""
        - "<yellow>{server_website}</yellow>"
    starting:
      title: "<bold><gradient:{color_primary}:{color_secondary}>{server_name}</gradient>"
      list:
        - ""
        - "<white>Arena: <aqua>{arena}"
        - "<white>Players: <aqua>{players}/<aqua>{max_players}"
        - ""
        - "<aqua>Starting in <#4CADD0>{time}</#4CADD0>"
        - ""
        - "<yellow>{server_website}</yellow>"
  limbo:
    title: "<bold><gradient:{color_primary}:{color_secondary}>{server_name}</gradient></bold>"
    list:
      - ""
      - "<white>Arena:</white> <aqua>{arena}</aqua>"
      - "<white>Players:</white> <aqua>{players}</aqua>"
      - "<white>Round:</white> <aqua>{round}/{round_max}</aqua>"
      - ""
      - "<green>➊</green> <white>{place_1}</white> <gray>✯ {stars_1}</gray>"
      - "<gold>➋</gold> <white>{place_2}</white> <gray>✯ {stars_2}</gray>"
      - "<red>➌</red> <white>{place_3}</white> <gray>✯ {stars_3}</gray>"
      - "<dark_gray>➍</dark_gray> <gray>{place_4}</gray> <dark_gray>✯ {stars_4}</dark_gray>"
      - "<dark_gray>➎</dark_gray> <gray>{place_5}</gray> <dark_gray>✯ {stars_5}</dark_gray>"
      - ""
      - "<aqua>Your Position:</aqua> <white>{place_player}</white> <gold>✯ {stars_player}</gold>"
      - ""
      - "<yellow>{server_website}</yellow>"
  in_game:
    starting:
      title: "<bold><gradient:{color_primary}:{color_secondary}>{server_name}</gradient>"
      list:
        - ""
        - "<white>Arena: <aqua>{arena}"
        - "<white>Game: <aqua>{game_display_name}"
        - "<white>Players: <aqua>{players}"
        - ""
        - "<aqua>Starting in <#4CADD0>{time}</#4CADD0>"
        - ""
        - "<yellow>{server_website}</yellow>"
  finish:
    title: "<bold><gradient:{color_primary}:{color_secondary}>{server_name}</gradient></bold>"
    list:
      - ""
      - "<white>Arena:</white> <aqua>{arena}</aqua>"
      - "<white>Players:</white> <aqua>{players}</aqua>"
      - ""
      - "<green>➊</green> <white>{place_1}</white> <gray>✯ {stars_1}</gray>"
      - "<gold>➋</gold> <white>{place_2}</white> <gray>✯ {stars_2}</gray>"
      - "<red>➌</red> <white>{place_3}</white> <gray>✯ {stars_3}</gray>"
      - "<dark_gray>➍</dark_gray> <gray>{place_4}</gray> <dark_gray>✯ {stars_4}</dark_gray>"
      - "<dark_gray>➎</dark_gray> <gray>{place_5}</gray> <dark_gray>✯ {stars_5}</dark_gray>"
      - ""
      - "<aqua>Your Position:</aqua> <white>{place_player}</white> <gold>✯ {stars_player}</gold>"
      - ""
      - "<yellow>{server_website}</yellow>"
  finish_standalone:
    title: "<bold><gradient:{color_primary}:{color_secondary}>{server_name}</gradient></bold>"
    list:
      - ""
      - "<white>Arena:</white> <aqua>{arena}</aqua>"
      - "<white>Players:</white> <aqua>{players}</aqua>"
      - ""
      - "<green>➊</green> <white>{place_1}</white>"
      - "<gold>➋</gold> <white>{place_2}</white>"
      - "<red>➌</red> <white>{place_3}</white>"
      - "<dark_gray>➍</dark_gray> <gray>{place_4}</gray>"
      - "<dark_gray>➎</dark_gray> <gray>{place_5}</gray>"
      - ""
      - "<aqua>Your Position:</aqua> <white>{place_player}</white>"
      - ""
      - "<yellow>{server_website}</yellow>"
