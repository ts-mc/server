player_commands:
  help:
    - "<bold><gradient:{color_primary}:{color_secondary}>{server_name}</gradient> <reset> <dark_gray>-</dark_gray> <gray>Help Command for users</gray>"
    - "<yellow>[] Required</yellow> <gray>-</gray> <green>() Optional</green>"
    - " "
    - "<#4CADD0>/ts quickjoin (player)</#4CADD0> <dark_gray>-</dark_gray> <gray>Enter a random game</gray>"
    - "<#4CADD0>/ts join [name/id] (player)</#4CADD0> <dark_gray>-</dark_gray> <gray>Enter a specific game</gray>"
    - "<#4CADD0>/ts leave (player)</#4CADD0> <dark_gray>-</dark_gray> <gray>Leave the current game</gray>"
    - "<#4CADD0>/ts party <gray>...</gray></#4CADD0> <dark_gray>-</dark_gray> <gray>Manage your party</gray>"
    - "<#4CADD0>/ts stats (category) (alltime/monthly/yearly) (page)</#4CADD0> <dark_gray>-</dark_gray> <gray>Check your stats</gray>"
    - "<#4CADD0>/ts tops (category) (alltime/monthly/yearly) (page)</#4CADD0> <dark_gray>-</dark_gray> <gray>Browse top stats</gray>"
    - "<#4CADD0>/ts tops <stat> <alltime/monthly/yearly> (page)</#4CADD0> <dark_gray>-</dark_gray> <gray>View top players for a stat</gray>"
    - "<#4CADD0>/ts achievements (category) (achievement) (page)</#4CADD0> <dark_gray>-</dark_gray> <gray>View achievements</gray>"
    - "<#4CADD0>/ts level</#4CADD0> <dark_gray>-</dark_gray> <gray>View your current level</gray>"
    - "<#4CADD0>/ts lang (locale|auto)</#4CADD0> <dark_gray>-</dark_gray> <gray>Change your language</gray>"
    - "<#4CADD0>/ts store</#4CADD0> <dark_gray>-</dark_gray> <gray>Open the store</gray>"
    - "<#4CADD0>/ts replay <module_id> (<replay_id>)</#4CADD0> <dark_gray>-</dark_gray> <gray>Watch a recorded match</gray>"
    - "<#4CADD0>/ts credits pay <player> <amount></#4CADD0> <dark_gray>-</dark_gray> <gray>Pay credits to another player</gray>"
    - "<#4CADD0>/tsa help</#4CADD0> <dark_gray>-</dark_gray> <gray>Help for administrators</gray>"
  usage:
    join: "{prefix} <red>Use: /ts join [arena_id|server:arena_id|(filter [page])] (player)</red>"
    quickjoin: "{prefix} <red>Use: /ts quickjoin (player)</red>"
    leave: "{prefix} <red>Use: /ts leave [player]</red>"
    vote: "{prefix} <red>Use: /ts vote [minigame|page <number>]</red>"
    party: "{prefix} <red>Use: /ts party <list|type|create|members|invite|search|join|accept|reject|kick|leader|leave> (player)</red>"
    stats: "{prefix} <red>Use: /ts stats (category) (alltime/monthly/yearly) (page)</red>"
    tops: "{prefix} <red>Use: /ts tops (category) (alltime/monthly/yearly) (page) or /ts tops <stat|module:stat> <alltime/monthly/yearly> (page)</red>"
    achievements: "{prefix} <red>Use: /ts achievements (category) (achievement) (page)</red>"
    level: "{prefix} <red>Use: /ts level</red>"
    lang: "{prefix} <red>Use: /ts lang (locale|auto)</red>"
    credits: "{prefix} <red>Use: /ts credits [pay] <player> <amount></red>"
    store: "{prefix} <red>Use: /ts store (page <number>|category <id> [page]|module <id> [page]|buy <category> <item> [page]|confirm <category> <item> [page]|purchase <category> <item> [page]|select <category> <item>)</red>"
    team: "{prefix} <red>Use: /ts team (join <team_id>)</red>"
  credits:
    balance: "{prefix} <yellow>You have <gold>{amount}</gold> credits.</yellow>"
    balance_unavailable: "{prefix} <red>Credits provider \"{provider}\" is not available right now.</red>"
    sent: "{prefix} <green>You paid {amount} credits to {player}.</green>"
    received: "{prefix} <green>You received {amount} credits from {player}.</green>"
    reward: "  <gold>⛁</gold> <yellow>+{amount} credits</yellow>"
    invalid_amount: "{prefix} <red>Invalid credits amount: {amount}</red>"
    player_not_found: "{prefix} <red>Player '{player}' not found.</red>"
    insufficient_funds: "{prefix} <red>You don't have enough credits.</red>"
    self_payment: "{prefix} <red>You cannot pay yourself.</red>"
    transfer_failed: "{prefix} <red>Unable to transfer credits right now. Try again later.</red>"
  rewards:
    summary: "  <gold>⛁</gold> <yellow>+{credits} credits</yellow> <dark_gray>|</dark_gray> <#4CADD0>✹</#4CADD0> <#4CADD0>+{exp} XP</#4CADD0>"
    summary_credits: "  <gold>⛁</gold> <yellow>+{credits} credits</yellow>"
    summary_exp: "  <#4CADD0>✹</#4CADD0> <#4CADD0>+{exp} XP</#4CADD0>"
  language:
    current_auto: "{prefix} <yellow>Your language is</yellow> <aqua>{locale}</aqua> <gray>(automatic from your client: {detected_locale})</gray><yellow>.</yellow>"
    current_manual: "{prefix} <yellow>Your language is</yellow> <aqua>{locale}</aqua> <gray>(manual selection)</gray><yellow>.</yellow>"
    changed: "{prefix} <green>Your language has been changed to</green> <aqua>{locale}</aqua><green>.</green>"
    automatic: "{prefix} <green>Your language will now be detected automatically.</green> <gray>Current: {locale}</gray>"
    disabled: "{prefix} <red>Language selection is disabled on this server.</red>"
    invalid: "{prefix} <red>Unsupported language:</red> <yellow>{locale}</yellow><red>.</red> <gray>Available:</gray> <aqua>{available}</aqua>"
  party:
    created: "{prefix} <green>Party created. Invite players to start playing together.</green>"
    already_in_party: "{prefix} <red>You are already in a party.</red>"
    no_available_arenas: "{prefix} <red>There are no arenas that support party size right now.</red>"
    not_in_party: "{prefix} <red>You are not in a party.</red>"
    not_leader: "{prefix} <red>Only the party leader can do that.</red>"
    cannot_invite_self: "{prefix} <red>You cannot invite yourself.</red>"
    target_in_party: "{prefix} <red>{player} is already in a party.</red>"
    target_not_in_party: "{prefix} <red>That player is not in your party.</red>"
    type_changed: "{prefix} <green>Party type updated to <white>{type}</white>.</green>"
    invalid_type: "{prefix} <red>Invalid party type. Use public/private.</red>"
    exceeds_max_size: "{prefix} <red>The party cannot exceed <white>{max}</white> players (max arena size).</red>"
    member_busy: "{prefix} <red>{player} is busy in another game.</red>"
    not_enough_slots: "{prefix} <red>Not enough available slots for the whole party (<white>{available}</white> free).</red>"
    only_leader_join: "{prefix} <red>Only the leader can join arenas for the party.</red>"
    left: "{prefix} <yellow>You left the party.</yellow>"
    leader_left: "{prefix} <yellow>The new leader is <white>{leader}</white>.</yellow>"
    leader_disconnected: "{prefix} <yellow>The party leader disconnected. The party will be dissolved in <white>{seconds}</white> seconds if they do not return.</yellow>"
    leader_reconnected: "{prefix} <green>The party leader has reconnected.</green>"
    disbanded_leader_absent: "{prefix} <red>The party was dissolved because the leader did not return in time.</red>"
    new_leader: "{prefix} <green><white>{leader}</white> is now the party leader.</green>"
    kicked: "{prefix} <red>{player} was removed from the party.</red>"
    kicked_target: "{prefix} <red>You were removed from the party by {leader}.</red>"
    join:
      joined: "{prefix} <green>{player} joined the party.</green>"
      not_found: "{prefix} <red>No public party found for that leader.</red>"
      not_public: "{prefix} <red>That party is not public.</red>"
    roles:
      leader: Leader
      member: Member
    invite:
      sent: "{prefix} <green>Invitation sent to <white>{player}</white>.</green>"
      received: "{prefix} <yellow>You received a party invite from <white>{leader}</white>. Use /ts party accept {leader}.</yellow>"
      already_sent: "{prefix} <red>You already invited {player}.</red>"
      not_found: "{prefix} <red>You have no invite from that player.</red>"
      rejected: "{prefix} <red>{player} rejected your party invitation.</red>"
      you_rejected: "{prefix} <yellow>You rejected the invitation from <white>{leader}</white>.</yellow>"
      accepted: "{prefix} <green>{player} joined the party.</green>"
    list:
      - "<bold><gradient:#4CADD0:#B2F9FF>Party</gradient>"
      - "<white>Type:</white> <aqua>{type}"
      - "<white>Leader:</white> <aqua>{leader}"
      - "<white>Members:</white> <gray>{members}"
    types:
      public: Public
      private: Private
  team:
    unavailable: "{prefix} <red>Team selection is not available for this game.</red>"
    not_available_phase: "{prefix} <red>Team selection is only available while waiting.</red>"
    invalid: "{prefix} <red>That team does not exist.</red>"
    full: "{prefix} <red>That team is full.</red>"
    selected: "{prefix} <green>You joined {team}.</green>"
  stats:
    text:
      header:
        - "{line_separator}"
        - "<gradient:{color_primary}:{color_secondary}><bold>{server_name}</bold></gradient> <gray>-</gray> <yellow>Your Stats</yellow> <gray>({period_label})</gray> <gray>(Page {page}/{page_total})</gray>"
        - " "
      global_title: "<gold>Global Stats</gold>"
      module_title: "<gold>{module_name}</gold>"
      entry: "<gray>• {stat}</gray>: <white>{stat_value}</white>"
      module_entry: "<gray>• {stat}</gray>: <white>{stat_value}</white>"
      footer:
        - " "
        - "<gray>Total tracked:</gray> <white>{stat_total}</white>"
    errors:
      invalid_period: "{prefix} <red>Unknown period:</red> <yellow>{period}</yellow><red>. Use:</red> <white>{valid_periods}</white><red>.</red>"
      category_not_found: "{prefix} <red>Unknown stats category:</red> <yellow>{category}</yellow><red>.</red>"
  tops:
    text:
      header:
        - "{line_separator}"
        - "<gradient:{color_primary}:{color_secondary}><bold>{server_name}</bold></gradient> <gray>-</gray> <yellow>Top {stat_display}</yellow> <gray>(Page {page}/{page_total})</gray>"
        - "<gray>Scope:</gray> <white>{scope}</white> <gray>•</gray> <gray>Module:</gray> <white>{module_name}</white>"
        - "<gray>Period:</gray> <white>{period_label}</white>"
        - " "
      entry: "<gray>#{position}</gray> <white>{player}</white> <gray>-</gray> <aqua>{stat_value}</aqua>"
      footer:
        - " "
        - "<gray>Total entries:</gray> <white>{entry_total}</white>"
        - "{line_separator}"
      empty: "{prefix} <yellow>No players have results for</yellow> <white>{stat_display}</white> <yellow>in</yellow> <white>{period_label}</white><yellow> yet.</yellow>"
    errors:
      unknown_stat: "{prefix} <red>Unknown stat:</red> <yellow>{stat_input}</yellow><red>. Use /ts stats to view available stats.</red>"
      ambiguous_stat: "{prefix} <red>That stat exists in multiple modules.</red> <yellow>Use /ts tops <module:stat> <alltime/monthly/yearly></yellow> <red>for:</red> <gray>{modules}</gray>"
      invalid_period: "{prefix} <red>Unknown period:</red> <yellow>{period}</yellow><red>. Use:</red> <white>{valid_periods}</white><red>.</red>"
      category_not_found: "{prefix} <red>Unknown stats category:</red> <yellow>{category}</yellow><red>.</red>"
    scope:
      global: Global
      module: Module
    unknown_player: Unknown
