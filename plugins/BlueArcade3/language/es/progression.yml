achievements:
  empty: '{prefix} <yellow>Aún no hay logros disponibles.</yellow>'
  phase_unlocked:
    - '{wide_line_separator}'
    - '<gray> </gray>'
    - '<bold><gradient:{color_primary}:{color_secondary}>{server_name}</gradient></bold> <gray>-</gray> <yellow>Logro</yellow> <gray>-</gray> <green>Desbloqueado</green>'
    - '<gray> </gray>'
    - '<white>{achievement_name}</white> <gray>({achievement_phase}/{achievement_phase_total})</gray>'
    - '<gray>{achievement_description}</gray>'
    - '<gray> </gray>'
    - '<gray>Progreso:</gray> {achievement_progress_bar} <gray>({achievement_progress})</gray>'
    - '<gray>Restante:</gray> {achievement_remaining_bar} <gray>({achievement_remaining})</gray>'
    - '<gray> </gray>'
    - '{wide_line_separator}'
  completed:
    - '{wide_line_separator}'
    - '<gray> </gray>'
    - '<bold><gradient:{color_primary}:{color_secondary}>{server_name}</gradient></bold> <gray>-</gray> <yellow>Logro</yellow> <gray>-</gray> <green>Completado</green>'
    - '<gray> </gray>'
    - '<white>{achievement_name}</white> <gray>({achievement_phase}/{achievement_phase_total})</gray>'
    - '<gray>{achievement_description}</gray>'
    - '<gray> </gray>'
    - '<gray>Progreso:</gray> {achievement_progress_bar} <gray>({achievement_progress})</gray>'
    - '<gray>Restante:</gray> {achievement_remaining_bar} <gray>({achievement_remaining})</gray>'
    - '<gray> </gray>'
    - '{wide_line_separator}'
  phase_default_name: 'Fase {phase_index}'
  requirements:
    none: 'No se enumeran requisitos.'
  status:
    completed: 'Terminado'
    current: 'En curso'
    locked: 'Bloqueado'
  errors:
    category_not_found: '{prefix} <red>Categoría de logros desconocidos:</red> <yellow>{category}</yellow><red>.</red>'
    achievement_not_found: '{prefix} <red>Logro desconocido:</red> <yellow>{achievement}</yellow><red>.</red>'
levels:
  status: '{prefix} <gray>Nivel</gray> <white>{level}</white> <dark_gray>-</dark_gray> <aqua>{level_title}</aqua> <dark_gray>•</dark_gray> <light_purple>{exp_current}</light_purple><gray>/</gray><light_purple>{exp_required}</light_purple> <gray>XP</gray> {exp_bar} <gray>({exp_remaining} para ir)</gray>'
  titles:
    default: 'Principiante'
  messages:
    exp_reward: '<dark_purple>✹</dark_purple> <light_purple>+{amount} XP</light_purple>'
    level_up:
      - '{wide_line_separator}'
      - '<gray> </gray>'
      - '<bold><gradient:{color_primary}:{color_secondary}>{server_name}</gradient></bold> <gray>-</gray> <yellow>Nivel</yellow> <gray>-</gray> <green>Arriba</green>'
      - '<gray> </gray>'
      - '<white>Nivel {level}</white> <gray>({level_title})</gray>'
      - '<gray>El siguiente nivel requiere</gray> <light_purple>{exp_required}</light_purple> <gray>XP</gray>'
      - '<gray> </gray>'
      - '{wide_line_separator}'
