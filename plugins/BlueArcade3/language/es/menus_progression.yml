      bedrock:
        title: '<gradient:{color_primary}:{color_secondary}><bold>{server_name}</bold></gradient> <gray>-</gray> <yellow>{category_name}</yellow> <gray>({page}/{page_total})</gray>'
        content:
          - '<white>{category_description}</white>'
          - '<white>Completado:</white> <white>{achievement_completed}</white>/<white>{achievement_total}</white>'
          - '<white>Página:</white> <white>{page}</white>/<white>{page_total}</white>'
        templates:
          achievement:
            text: '<aqua>{achievement_name}</aqua> <white>- {achievement_status}</white> <white>({achievement_phase}/{achievement_phase_total})</white>'
          empty:
            text: '<white>No se encontraron logros.</white>'
      java:
        title: '<gradient:{color_primary}:{color_secondary}><bold>{server_name}</bold></gradient> <gray>-</gray> <yellow>{category_name}</yellow> <gray>({page}/{page_total})</gray>'
        templates:
          achievement:
            name: '<aqua>{achievement_name}</aqua>'
            lore:
              - '<gray>{achievement_description}</gray>'
              - '<gray>Estado:</gray> <white>{achievement_status}</white>'
              - '<gray>Fase:</gray> <white>{achievement_phase}</white>/<white>{achievement_phase_total}</white>'
              - '<gray>Progreso:</gray> <white>{achievement_progress}</white>'
              - '<gray>{achievement_phase_name}</gray>'
              - '<gray>Haz clic para ver las fases.</gray>'
        empty:
          name: '<dark_gray>Sin logro</dark_gray>'
          lore:
            - '<gray>Sigue jugando para desbloquear más.</gray>'
        items:
          info:
            name: '<aqua>{category_name}</aqua>'
            lore:
              - '<gray>Logros:</gray> <white>{achievement_total}</white>'
              - '<gray>Completado:</gray> <white>{achievement_completed}</white>'
              - '<gray>Página:</gray> <white>{page}</white>/<white>{page_total}</white>'
