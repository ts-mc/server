menus:
  achievements:
    categories:
      bedrock:
        title: '<gradient:{color_primary}:{color_secondary}><bold>{server_name}</bold></gradient> <gray>-</gray> <yellow>Logros</yellow> <gray>({page}/{page_total})</gray>'
        content:
          - '<white>Selecciona una categoría de logros.</white>'
          - '<white>Categorías:</white> <white>{category_total}</white>'
          - '<white>Página:</white> <white>{page}</white>/<white>{page_total}</white>'
        templates:
          category:
            text: '<aqua>{category_name}</aqua> <white>({category_progress})</white>'
          empty:
            text: '<white>No hay logros disponibles.</white>'
      java:
        title: '<gradient:{color_primary}:{color_secondary}><bold>{server_name}</bold></gradient> <gray>-</gray> <yellow>Logros</yellow> <gray>({page}/{page_total})</gray>'
        templates:
          category:
            name: '<aqua>{category_name}</aqua>'
            lore:
              - '<gray>{category_description}</gray>'
              - '<gray>Logros:</gray> <white>{category_achievement_total}</white>'
              - '<gray>Completado:</gray> <white>{category_progress}</white>'
        empty:
          name: '<dark_gray>Sin categoría</dark_gray>'
          lore:
            - '<gray>Aún no hay logros para mostrar.</gray>'
        items:
          info:
            name: '<aqua>Logros</aqua>'
            lore:
              - '<gray>Categorías:</gray> <white>{category_total}</white>'
              - '<gray>Página:</gray> <white>{page}</white>/<white>{page_total}</white>'
