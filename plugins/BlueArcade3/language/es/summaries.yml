    - '<gray> </gray>'
    - '{wide_line_separator}'
  stats:
    java:
      header:
        - '{wide_line_separator}'
        - ' '
        - '  <bold><gradient:{color_primary}:{color_secondary}>{server_name}</gradient></bold> <gray>-</gray> <yellow>Progreso de estadísticas</yellow>'
        - ' '
      entry: '    <gray>• {stat}</gray> <white>+{delta}</white> <dark_gray>(Total: {total})'
      module_entry: '    <gray>•</gray> <yellow>[{module}]</yellow> <white>{stat}</white> <green>+{delta}</green> <dark_gray>(Total: {total})'
      footer:
        - ' '
        - '{wide_line_separator}'
