      title: 'Progreso de estadísticas'
      content_header: 'Estadísticas obtenidas en este partida:'
      entry: '• {stat}: +{delta} (Total: {total})'
      empty: 'No hay nuevas estadísticas en esta ronda.'
      buttons:
        play_again: 'jugar de nuevo'
        lobby: 'Regresar al vestíbulo'
    invalid_period: '{prefix} <yellow>Período de estadísticas resumidas no válidas ''{period}''. Usando todo el tiempo.</yellow>'
  replay_recorded:
    - '{wide_line_separator}'
    - '<gray> </gray>'
    - '<gray>   </gray><green>Esta partida ha sido grabada.</green>'
    - '<gray>   </gray><click:run_command:''/ts replay {module_id} {replay_id}''><gold><bold>Haz clic aquí</bold></gold></click> <gray>para ver la repetición.</gray>'
    - '<gray> </gray>'
    - '{wide_line_separator}'
