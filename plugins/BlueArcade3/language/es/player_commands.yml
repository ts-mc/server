    current_auto: '{prefix} <yellow>Tu idioma es</yellow> <aqua>{locale}</aqua> <gray>(automático desde tu cliente: {detected_locale})</gray><yellow>.</yellow>'
    current_manual: '{prefix} <yellow>Tu idioma es</yellow> <aqua>{locale}</aqua> <gray>(selección manual)</gray><yellow>.</yellow>'
    changed: '{prefix} <green>Tu idioma ha cambiado a</green> <aqua>{locale}</aqua><green>.</green>'
    automatic: '{prefix} <green>Tu idioma se detectará automáticamente.</green> <gray>Actual: {locale}</gray>'
    disabled: '{prefix} <red>La selección de idioma está deshabilitada en este servidor.</red>'
    invalid: '{prefix} <red>Idioma no compatible:</red> <yellow>{locale}</yellow><red>.</red> <gray>Disponible:</gray> <aqua>{available}</aqua>'
  party:
    created: '{prefix} <green>Grupo creado. Invita jugadores para empezar a jugar juntos.</green>'
    already_in_party: '{prefix} <red>Ya estás en un grupo.</red>'
    no_available_arenas: '{prefix} <red>No hay arenas que admitan el tamaño del grupo en este momento.</red>'
    not_in_party: '{prefix} <red>No estás en un grupo.</red>'
    not_leader: '{prefix} <red>Solo el líder del grupo puede hacer eso.</red>'
    cannot_invite_self: '{prefix} <red>No puedes invitarte a ti mismo.</red>'
    target_in_party: '{prefix} <red>{player} ya está en un grupo.</red>'
    target_not_in_party: '{prefix} <red>Ese jugador no está en tu grupo.</red>'
    type_changed: '{prefix} <green>Tipo de grupo actualizado a <white>{type}</white>.</green>'
    invalid_type: '{prefix} <red>Tipo de grupo no válido. Usa public/private.</red>'
    exceeds_max_size: '{prefix} <red>El grupo no puede exceder <white>{max}</white> jugadores (tamaño máximo de arena).</red>'
    member_busy: '{prefix} <red>{player} está ocupado en otro juego.</red>'
    not_enough_slots: '{prefix} <red>No hay suficientes espacios disponibles para todo el grupo (<white>{available}</white> libres).</red>'
    only_leader_join: '{prefix} <red>Solo el líder puede unirse a las arenas del grupo.</red>'
    left: '{prefix} <yellow>Has salido del grupo.</yellow>'
    leader_left: '{prefix} <yellow>El nuevo líder es <white>{leader}</white>.</yellow>'
    leader_disconnected: '{prefix} <yellow>El líder del grupo se desconectó. El grupo se disolverá en <white>{seconds}</white> segundos si no vuelve.</yellow>'
    leader_reconnected: '{prefix} <green>El líder del grupo se ha vuelto a conectar.</green>'
    disbanded_leader_absent: '{prefix} <red>El grupo se disolvió porque el líder no volvió a tiempo.</red>'
    new_leader: '{prefix} <green><white>{leader}</white> ahora es el líder del grupo.</green>'
    kicked: '{prefix} <red>{player} fue eliminado del grupo.</red>'
    kicked_target: '{prefix} <red>Fuiste eliminado del grupo por {leader}.</red>'
    join:
      joined: '{prefix} <green>{player} se unió al grupo.</green>'
      not_found: '{prefix} <red>No se encontró ningún grupo público para ese líder.</red>'
      not_public: '{prefix} <red>Ese grupo no es público.</red>'
    roles:
      leader: 'Líder'
      member: 'Miembro'
    invite:
      sent: '{prefix} <green>Invitación enviada a <white>{player}</white>.</green>'
      received: '{prefix} <yellow>Recibiste una invitación a un grupo de <white>{leader}</white>. Usa /ts party accept {leader}.</yellow>'
      already_sent: '{prefix} <red>Ya invitaste a {player}.</red>'
      not_found: '{prefix} <red>No tienes invitación de ese jugador.</red>'
      rejected: '{prefix} <red>{player} rechazó la invitación a tu grupo.</red>'
      you_rejected: '{prefix} <yellow>Rechazaste la invitación de <white>{leader}</white>.</yellow>'
      accepted: '{prefix} <green>{player} se unió al grupo.</green>'
    list:
      - '<bold><gradient:#4CADD0:#B2F9FF>Grupo</gradient>'
      - '<white>Tipo:</white> <aqua>{type}'
      - '<white>Líder:</white> <aqua>{leader}'
      - '<white>Miembros:</white> <gray>{members}'
    types:
      public: 'Pública'
      private: 'Privada'
  team:
    unavailable: '{prefix} <red>La selección de equipo no está disponible para este juego.</red>'
    not_available_phase: '{prefix} <red>La selección de equipo solo está disponible mientras se espera.</red>'
    invalid: '{prefix} <red>Ese equipo no existe.</red>'
    full: '{prefix} <red>Ese equipo está completo.</red>'
    selected: '{prefix} <green>Te uniste a {team}.</green>'
  stats:
    text:
      header:
        - '{line_separator}'
        - '<gradient:{color_primary}:{color_secondary}><bold>{server_name}</bold></gradient> <gray>-</gray> <yellow>Tus estadísticas</yellow> <gray>({period_label})</gray> <gray>(Página {page}/{page_total})</gray>'
        - ' '
      global_title: '<gold>Estadísticas globales</gold>'
      module_title: '<gold>{module_name}</gold>'
      entry: '<gray>• {stat}</gray>: <white>{stat_value}</white>'
      module_entry: '<gray>• {stat}</gray>: <white>{stat_value}</white>'
      footer:
        - ' '
        - '<gray>Total rastreado:</gray> <white>{stat_total}</white>'
    errors:
      invalid_period: '{prefix} <red>Periodo desconocido:</red> <yellow>{period}</yellow><red>. Uso:</red> <white>{valid_periods}</white><red>.</red>'
      category_not_found: '{prefix} <red>Categoría de estadísticas desconocida:</red> <yellow>{category}</yellow><red>.</red>'
  tops:
    text:
      header:
        - '{line_separator}'
        - '<gradient:{color_primary}:{color_secondary}><bold>{server_name}</bold></gradient> <gray>-</gray> <yellow>Top {stat_display}</yellow> <gray>(Página {page}/{page_total})</gray>'
        - '<gray>Alcance:</gray> <white>{scope}</white> <gray>•</gray> <gray>Módulo:</gray> <white>{module_name}</white>'
        - '<gray>Período:</gray> <white>{period_label}</white>'
        - ' '
      entry: '<gray>#{position}</gray> <white>{player}</white> <gray>-</gray> <aqua>{stat_value}</aqua>'
      footer:
        - ' '
        - '<gray>Total de entradas:</gray> <white>{entry_total}</white>'
        - '{line_separator}'
      empty: '{prefix} <yellow>Ningún jugador tiene resultados para</yellow> <white>{stat_display}</white> <yellow>en</yellow> <white>{period_label}</white><yellow> todavía.</yellow>'
    errors:
      unknown_stat: '{prefix} <red>Estadística desconocida:</red> <yellow>{stat_input}</yellow><red>. Usa /ts stats para ver las estadísticas disponibles.</red>'
      ambiguous_stat: '{prefix} <red>Esa estadística existe en varios módulos.</red> <yellow>Usa /ts tops <module:stat> <alltime/monthly/yearly></yellow> <red>para:</red> <gray>{modules}</gray>'
      invalid_period: '{prefix} <red>Periodo desconocido:</red> <yellow>{period}</yellow><red>. Uso:</red> <white>{valid_periods}</white><red>.</red>'
      category_not_found: '{prefix} <red>Categoría de estadísticas desconocida:</red> <yellow>{category}</yellow><red>.</red>'
    scope:
      global: 'Global'
      module: 'Módulo'
    unknown_player: 'Desconocido'
