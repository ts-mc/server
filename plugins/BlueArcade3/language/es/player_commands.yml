    team: '{prefix} <red>Uso: /ts team (join <team_id>)</red>'
  credits:
    balance: '{prefix} <yellow>Tienes <gold>{amount}</gold> créditos.</yellow>'
    balance_unavailable: '{prefix} <red>El proveedor de créditos "{provider}" no está disponible en este momento.</red>'
    sent: '{prefix} <green>Pagaste {amount} créditos a {player}.</green>'
    received: '{prefix} <green>Recibiste {amount} créditos de {player}.</green>'
    reward: '<gold>⛁</gold> <yellow>+{amount} créditos</yellow>'
    invalid_amount: '{prefix} <red>Cantidad de créditos no válidos: {amount}</red>'
    player_not_found: '{prefix} <red>Jugador ''{player}'' no encontrado.</red>'
    insufficient_funds: '{prefix} <red>No tienes suficientes créditos.</red>'
    self_payment: '{prefix} <red>No puedes pagarte a ti mismo.</red>'
