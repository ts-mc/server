    leave: '{prefix} <red>Uso: /ts leave [player]</red>'
    vote: '{prefix} <red>Uso: /ts vote [minigame|page <number>]</red>'
    party: '{prefix} <red>Uso: /ts party <list|type|create|members|invite|search|join|accept|reject|kick|leader|leave> (player)</red>'
    stats: '{prefix} <red>Uso: /ts stats (category) (alltime/monthly/yearly) (page)</red>'
    tops: '{prefix} <red>Uso: /ts tops (category) (alltime/monthly/yearly) (page) o /ts tops <stat|module:stat> <alltime/monthly/yearly> (page)</red>'
    achievements: '{prefix} <red>Uso: /ts achievements (category) (achievement) (page)</red>'
    level: '{prefix} <red>Uso: /ts level</red>'
    lang: '{prefix} <red>Uso: /ts lang (locale|auto)</red>'
    credits: '{prefix} <red>Uso: /ts credits [pay] <player> <amount></red>'
