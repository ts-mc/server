player_commands:
  help:
    - '<bold><gradient:{color_primary}:{color_secondary}>{server_name}</gradient> <reset> <dark_gray>-</dark_gray> <gray>Comando de ayuda para usuarios</gray>'
    - '<yellow>[] Obligatorio</yellow> <gray>-</gray> <green>() Opcional</green>'
    - ' '
    - '<#4CADD0>/ts quickjoin (player)</#4CADD0> <dark_gray>-</dark_gray> <gray>Entrar en una partida aleatoria</gray>'
    - '<#4CADD0>/ts join [name/id] (player)</#4CADD0> <dark_gray>-</dark_gray> <gray>Entrar en una partida concreta</gray>'
    - '<#4CADD0>/ts leave (player)</#4CADD0> <dark_gray>-</dark_gray> <gray>Salir de la partida actual</gray>'
    - '<#4CADD0>/ts party <gray>...</gray></#4CADD0> <dark_gray>-</dark_gray> <gray>Gestionar tu grupo</gray>'
    - '<#4CADD0>/ts stats (category) (alltime/monthly/yearly) (page)</#4CADD0> <dark_gray>-</dark_gray> <gray>Consultar tus estadísticas</gray>'
    - '<#4CADD0>/ts tops (category) (alltime/monthly/yearly) (page)</#4CADD0> <dark_gray>-</dark_gray> <gray>Ver los tops de estadísticas</gray>'
    - '<#4CADD0>/ts tops <stat> <alltime/monthly/yearly> (page)</#4CADD0> <dark_gray>-</dark_gray> <gray>Ver los mejores jugadores de una estadística</gray>'
    - '<#4CADD0>/ts achievements (category) (achievement) (page)</#4CADD0> <dark_gray>-</dark_gray> <gray>Ver logros</gray>'
    - '<#4CADD0>/ts level</#4CADD0> <dark_gray>-</dark_gray> <gray>Ver tu nivel actual</gray>'
    - '<#4CADD0>/ts lang (locale|auto)</#4CADD0> <dark_gray>-</dark_gray> <gray>Cambiar tu idioma</gray>'
