signs:
  join:
    line1: '<bold><gradient:{color_primary}:{color_secondary}>{server_name}</gradient>'
    line2: '<yellow>{arena_status}</yellow>'
    line3: '{arena_displayname}'
    line4: '<dark_aqua>{players}</dark_aqua><gray>/</gray><dark_aqua>{players_max}</dark_aqua>'
  auto:
    line1: '<bold><gradient:{color_primary}:{color_secondary}>{server_name}</gradient>'
    line2: '<yellow>{arena_status}</yellow>'
    line3: '{arena_displayname}'
    line4: '<dark_aqua>{players}</dark_aqua><gray>/</gray><dark_aqua>{players_max}</dark_aqua>'
  quickjoin:
    line1: ''
    line2: '<bold><gradient:{color_primary}:{color_secondary}>{server_name}</gradient>'
    line3: '<yellow><bold>Unión rápida</yellow><reset>'
    line4: ''
  top:
    line1: '<bold><gradient:{color_primary}:{color_secondary}>{server_name}</gradient>'
    line2: '<yellow>{top_module}</yellow>'
    line3: '<aqua>#{top_position} {top_player}</aqua>'
    line4: '<dark_aqua>{top_stat}</dark_aqua> <gray>|</gray> <white>{top_value}</white> <gray>|</gray> <gray>{top_period}</gray>'
    empty_player: 'No hay entradas'
  leave:
    line1: ''
    line2: '<bold><gradient:{color_primary}:{color_secondary}>{server_name}</gradient>'
    line3: '<red><bold>Salir</red><reset>'
    line4: ''
  statuses:
    waiting:
      name: '<green>Esperando</green>'
    starting:
      name: '<yellow>Comenzando</yellow>'
    running:
      name: '<red>En partida</red>'
    finishing:
      name: '<blue>Finalizando</blue>'
    restarting:
      name: '<gold>Reiniciando</gold>'
    disabled:
      name: '<dark_red>Desactivada</dark_red>'
    searching:
      name: '<white>Buscando</white>'
      animation:
        frames:
          - '<white>Buscando.</white>'
          - '<white>Buscando..</white>'
          - '<white>Buscando...</white>'

