language: 'Español (España)'
server:
  name: 'TheySix Events'
  website: https://events.theysix.tech
colors:
  primary: '#4CADD0'
  secondary: '#B2F9FF'
  accent: 'yellow'
  success: 'green'
  warning: 'yellow'
  error: 'red'
  muted: 'gray'
  dark: 'dark_gray'
lines:
  separator: '<dark_gray><strikethrough>--------------------------</dark_gray><reset>'
  wide_separator: '<dark_gray><strikethrough>----------------------------------------------</dark_gray><reset>'
prefix: '<b><gradient:#4cadd0:#b2f9ff>ѕᴇʀᴠᴇʀ</gradient></b> <gray>|</gray>'
plugin_info:
  - '{line_separator}'
  - ' '
  - '<bold><gradient:{color_primary}:{color_secondary}>{server_name}</gradient> <gray>-</gray> <yellow>{plugin_version}</yellow>'
  - '<gray>Web oficial: {server_website}</gray>'
  - ' '
  - '<gray>Usa</gray> <#4CADD0>/ts help</#4CADD0> <gray>para obtener ayuda.</gray>'
  - ' '
  - '{line_separator}'
