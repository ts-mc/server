      - ''
      - '<white>Nombre:</white> <aqua>{player_name}</aqua>'
      - '<white>Ping:</white> <aqua>{player_ping}ms</aqua>'
      - ''
      - '<white>Victorias:</white> <aqua>{stat_global_wins}</aqua>'
