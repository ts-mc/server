# [!] Arcade by TheySix | https://events.theysix.tech/wiki/arcade/ [!]

# ========================================
# File settings
# ========================================
file_version: '4'
language: English (UK)
prefix: "<bold><gradient:#B3000C:#E40010:#D8D8D8:#1FD537:#00B32C>ѕᴇʀᴠᴇʀ</gradient></bold> <gray>|</gray>"

# ========================================
# PLAYER EXPERIENCE
# ========================================

# ----------------------------------------
# Player Messages
# ----------------------------------------
player:
  lobby:
    you_join: '{prefix} <yellow>You have joined the arena</yellow> <yellow>{arena_display_name}<yellow>.</yellow>'
    player_joined: '{prefix} <gray>{player}</gray> <yellow>has joined the arena. (</yellow><yellow>{players}<dark_gray>/<yellow>{max_players}<yellow>)</yellow>'
    you_left: '{prefix} <yellow>You have left the arena</yellow> <yellow>{arena_display_name}<yellow>.</yellow>'
    player_leaves: '{prefix} <gray>{player}</gray> <red>has left the arena. (</red><yellow>{players}<dark_gray>/<yellow>{max_players}<red>)</red>'
  
  game:
    lobby_countdown: '{prefix} <yellow>The arena will start in</yellow> <yellow>{time} <yellow>seconds.</yellow>'
    arena_almost_full: '{prefix} <gold>The arena is almost </gold><bold><red>FULL</red></bold><gold>! The countdown has been reduced to {time} seconds.</gold>'
    player_voted: '{prefix} <yellow>{player_name}</yellow> <yellow>has voted for the mini game</yellow> <yellow>{game}</yellow><yellow>.</yellow> <gold>+1 Vote</gold>'
    no_winner_timeout: '{prefix} <yellow>The game did not finish in time, so there are no winners.</yellow>'
    team_assignment: '{prefix} <yellow>Your team:</yellow> <white>{team}</white>'
  
  # Player errors (things they might encounter)
  errors:
    already_in_game: '{prefix} <red>You are already in the game. To leave use /ts leave</red>'
    not_in_game: '{prefix} <red>You are not currently in any game.</red>'
    no_arena: '{prefix} <red>No arena is available at this time. Please try again later.</red>'
    arena_started: '{prefix} <red>The arena</red> <yellow>{arena_display_name}</yellow> <red>has already started.</red>'
    arena_full: '{prefix} <red>The arena</red> <yellow>{arena_display_name}</yellow> <red>is full.</red>'
    arena_starting_full: '{prefix} <red>The arena</red> <yellow>{arena_display_name}</yellow> <red>is starting and is already full.</red>'
    arena_stopped: '{prefix} <red>The arena has been stopped due to lack of players. At least</red> <yellow>{min_players}</yellow> <red>players are needed.</red>'
    chat_muted: '{prefix} <red>The chat is muted. You will be able to talk in a few seconds.</red>'
    not_allowed_command: '{prefix} <red>You cannot use this command while you are in a game. Use /leave to leave.</red>'
    stats_disabled: '{prefix} <red>The stats system is currently disabled.</red>'
    achievements_disabled: '{prefix} <red>The achievements system is currently disabled.</red>'
    achievements_menu_disabled: '{prefix} <red>The achievements menu is currently disabled.</red>'
    levels_disabled: '{prefix} <red>The levels system is currently disabled.</red>'
    stats_empty: '{prefix} <yellow>No stats available yet. Play some games first!</yellow>'
    no_votes: '{prefix} <red>You have no votes available. Try increasing your rank.</red>'
    item_cooldown: '{prefix} <yellow>Please wait {seconds}s before using that item.</yellow>'
    arena_in_game: '{prefix} <red>The arena</red> <yellow>{arena_display_name}</yellow> <red>is currently in-game.</red>'
    searching: '{prefix} <yellow>No arena is available right now.</yellow>'
    voting_unavailable: '{prefix} <red>Voting is not available at this moment.</red>'
    minigame_not_available: '{prefix} <red>That minigame cannot be voted right now.</red>'

# ----------------------------------------
# Game Items
# ----------------------------------------
items:
  game:
    vote_game: <yellow>Vote for mini-games</yellow>
    leave_game: <red>Leave the game</red>

# ----------------------------------------
# Player Commands Help
# ----------------------------------------
player_commands:
  help:
  - <bold><gradient:#4CADD0:#B2F9FF>TheySix Events</gradient> <reset> <dark_gray>-</dark_gray> <gray>Help Command for users</gray>
  - <yellow>[] Requiered</yellow> <gray>-</gray> <green>() Optional</green>
  - ' '
  - <gold>/ts quickjoin (player)</gold> <dark_gray>-</dark_gray> <gray>Enter a random game</gray>
  - <gold>/ts join [name/id] (player)</gold> <dark_gray>-</dark_gray> <gray>Enter a specific game</gray>
  - <gold>/ts leave (player)</gold> <dark_gray>-</dark_gray> <gray>Leave the current game</gray>
  - <gold>/ts party <gray>...</gray></gold> <dark_gray>-</dark_gray> <gray>Manage your party</gray>
  - <gold>/ts stats (category) (alltime/monthly/yearly) (page)</gold> <dark_gray>-</dark_gray> <gray>Check your stats</gray>
  - <gold>/ts tops (category) (alltime/monthly/yearly) (page)</gold> <dark_gray>-</dark_gray> <gray>Browse top stats</gray>
  - <gold>/ts tops <stat> <alltime/monthly/yearly> (page)</gold> <dark_gray>-</dark_gray> <gray>View top players for a stat</gray>
  - <gold>/ts achievements (category) (achievement) (page)</gold> <dark_gray>-</dark_gray> <gray>View achievements</gray>
  - <gold>/ts level</gold> <dark_gray>-</dark_gray> <gray>View your current level</gray>
  - <gold>/ts store</gold> <dark_gray>-</dark_gray> <gray>Open the store</gray>
  - <gold>/ts credits pay <player> <amount></gold> <dark_gray>-</dark_gray> <gray>Pay credits to another player</gray>
  - <gold>/tsa help</gold> <dark_gray>-</dark_gray> <gray>Help for administrators</gray>
  
  usage:
    join: '{prefix} <red>Use: /ts join [arena|(filter [page])] (player)</red>'
    quickjoin: '{prefix} <red>Use: /ts quickjoin (player)</red>'
    leave: '{prefix} <red>Use: /ts leave [player]</red>'
    vote: '{prefix} <red>Use: /ts vote [minigame|page <number>]</red>'
    party: '{prefix} <red>Use: /ts party <list|type|create|members|invite|search|join|accept|reject|kick|leader|leave> (player)</red>'
    stats: '{prefix} <red>Use: /ts stats (category) (alltime/monthly/yearly) (page)</red>'
    tops: '{prefix} <red>Use: /ts tops (category) (alltime/monthly/yearly) (page) or /ts tops <stat|module:stat> <alltime/monthly/yearly> (page)</red>'
    achievements: '{prefix} <red>Use: /ts achievements (category) (achievement) (page)</red>'
    level: '{prefix} <red>Use: /ts level</red>'
    credits: '{prefix} <red>Use: /ts credits [pay] <player> <amount></red>'
    store: '{prefix} <red>Use: /ts store (page <number>|category <id> [page]|module <id> [page]|buy <category> <item> [page]|confirm <category> <item> [page]|purchase <category> <item> [page]|select <category> <item>)</red>'
    team: '{prefix} <red>Use: /ts team (join <team_id>)</red>'
  
  credits:
    balance: '{prefix} <yellow>You have <gold>{amount}</gold> credits.</yellow>'
    balance_unavailable: '{prefix} <red>Credits provider "{provider}" is not available right now.</red>'
    sent: '{prefix} <green>You paid {amount} credits to {player}.</green>'
    received: '{prefix} <green>You received {amount} credits from {player}.</green>'
    reward: '  <gold>⛁</gold> <yellow>+{amount} credits</yellow>'
    invalid_amount: '{prefix} <red>Invalid credits amount: {amount}</red>'
    player_not_found: '{prefix} <red>Player ''{player}'' not found.</red>'
    insufficient_funds: '{prefix} <red>You don''t have enough credits.</red>'
    self_payment: '{prefix} <red>You cannot pay yourself.</red>'
    transfer_failed: '{prefix} <red>Unable to transfer credits right now. Try again later.</red>'
  
  party:
    created: '{prefix} <green>Party created. Invite players to start playing together.</green>'
    already_in_party: '{prefix} <red>You are already in a party.</red>'
    no_available_arenas: '{prefix} <red>There are no arenas that support party size right now.</red>'
    not_in_party: '{prefix} <red>You are not in a party.</red>'
    not_leader: '{prefix} <red>Only the party leader can do that.</red>'
    cannot_invite_self: '{prefix} <red>You cannot invite yourself.</red>'
    target_in_party: '{prefix} <red>{player} is already in a party.</red>'
    target_not_in_party: '{prefix} <red>That player is not in your party.</red>'
    type_changed: '{prefix} <green>Party type updated to <white>{type}</white>.</green>'
    invalid_type: '{prefix} <red>Invalid party type. Use public/private.</red>'
    exceeds_max_size: '{prefix} <red>The party cannot exceed <white>{max}</white> players (max arena size).</red>'
    member_busy: '{prefix} <red>{player} is busy in another game.</red>'
    not_enough_slots: '{prefix} <red>Not enough available slots for the whole party (<white>{available}</white> free).</red>'
    only_leader_join: '{prefix} <red>Only the leader can join arenas for the party.</red>'
    left: '{prefix} <yellow>You left the party.</yellow>'
    leader_left: '{prefix} <yellow>The new leader is <white>{leader}</white>.</yellow>'
    new_leader: '{prefix} <green><white>{leader}</white> is now the party leader.</green>'
    kicked: '{prefix} <red>{player} was removed from the party.</red>'
    kicked_target: '{prefix} <red>You were removed from the party by {leader}.</red>'
    join:
      joined: '{prefix} <green>{player} joined the party.</green>'
      not_found: '{prefix} <red>No public party found for that leader.</red>'
      not_public: '{prefix} <red>That party is not public.</red>'
    roles:
      leader: Leader
      member: Member
    invite:
      sent: '{prefix} <green>Invitation sent to <white>{player}</white>.</green>'
      received: '{prefix} <yellow>You received a party invite from <white>{leader}</white>. Use /ts party accept {leader}.</yellow>'
      already_sent: '{prefix} <red>You already invited {player}.</red>'
      not_found: '{prefix} <red>You have no invite from that player.</red>'
      rejected: '{prefix} <red>{player} rejected your party invitation.</red>'
      you_rejected: '{prefix} <yellow>You rejected the invitation from <white>{leader}</white>.</yellow>'
      accepted: '{prefix} <green>{player} joined the party.</green>'
    list:
    - <bold><gradient:yellow:gold>Party</gradient>
    - <white>Type:</white> <yellow>{type}
    - <white>Leader:</white> <yellow>{leader}
    - <white>Members:</white> <gray>{members}
    types:
      public: Public
      private: Private
  
  team:
    unavailable: '{prefix} <red>Team selection is not available for this game.</red>'
    not_available_phase: '{prefix} <red>Team selection is only available while waiting.</red>'
    invalid: '{prefix} <red>That team does not exist.</red>'
    full: '{prefix} <red>That team is full.</red>'
    selected: '{prefix} <green>You joined {team}.</green>'
  
  stats:
    text:
      header:
      - <dark_gray><strikethrough>--------------------------</dark_gray><reset>
      - <gradient:#4CADD0:#B2F9FF><bold>TheySix Events</bold></gradient> <gray>-</gray> <yellow>Your Stats</yellow> <gray>({period_label})</gray> <gray>(Page {page}/{page_total})</gray>
      - ' '
      global_title: <gold>Global Stats</gold>
      module_title: <gold>{module_name}</gold>
      entry: '<gray>• {stat}</gray>: <white>{stat_value}</white>'
      module_entry: '<gray>• {stat}</gray>: <white>{stat_value}</white>'
      footer:
      - ' '
      - <gray>Total tracked:</gray> <white>{stat_total}</white>
    errors:
      invalid_period: '{prefix} <red>Unknown period:</red> <yellow>{period}</yellow><red>. Use:</red> <white>{valid_periods}</white><red>.</red>'
      category_not_found: '{prefix} <red>Unknown stats category:</red> <yellow>{category}</yellow><red>.</red>'
  
  tops:
    text:
      header:
      - <dark_gray><strikethrough>--------------------------</dark_gray><reset>
      - <gradient:#4CADD0:#B2F9FF><bold>TheySix Events</bold></gradient> <gray>-</gray> <yellow>Top {stat_display}</yellow> <gray>(Page {page}/{page_total})</gray>
      - <gray>Scope:</gray> <white>{scope}</white> <gray>•</gray> <gray>Module:</gray> <white>{module_name}</white>
      - <gray>Period:</gray> <white>{period_label}</white>
      - ' '
      entry: <gray>#{position}</gray> <white>{player}</white> <gray>-</gray> <yellow>{stat_value}</yellow>
      footer:
      - ' '
      - <gray>Total entries:</gray> <white>{entry_total}</white>
      - <dark_gray><strikethrough>--------------------------</dark_gray><reset>
      empty: '{prefix} <yellow>No players have results for</yellow> <white>{stat_display}</white> <yellow>in</yellow> <white>{period_label}</white><yellow> yet.</yellow>'
    errors:
      unknown_stat: '{prefix} <red>Unknown stat:</red> <yellow>{stat_input}</yellow><red>. Use /ts stats to view available stats.</red>'
      ambiguous_stat: '{prefix} <red>That stat exists in multiple modules.</red> <yellow>Use /ts tops <module:stat> <alltime/monthly/yearly></yellow> <red>for:</red> <gray>{modules}</gray>'
      invalid_period: '{prefix} <red>Unknown period:</red> <yellow>{period}</yellow><red>. Use:</red> <white>{valid_periods}</white><red>.</red>'
      category_not_found: '{prefix} <red>Unknown stats category:</red> <yellow>{category}</yellow><red>.</red>'
    scope:
      global: Global
      module: Module
    unknown_player: Unknown

