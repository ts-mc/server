# ----------------------------------------
# Game Results & Summary
# ----------------------------------------
summary:
  # Generic summary for most games
  mini_game:
  - <dark_gray><strikethrough>----------------------------------------------</dark_gray><reset>
  - ' '
  - '     <green>➀ <bold>{place_1}</green> <gray>✯ +3</gray>'
  - '     <gold>➁ <bold>{place_2}</gold> <gray>✯ +2</gray>'
  - '     <red>➂ <bold>{place_3}</red> <gray>✯ +1</gray>'
  - ' '
  - '  <gold>⛁</gold> <yellow>{credits_earned}  <gray>|</gray>  <gold>✹</gold> <gold>{xp_earned}</gold>  <gray>|</gray>  <gold>✯</gold> <yellow>{stars_earned}  <gray>|</gray>  <green>Your place:</green> <gold>{place_player}</gold>'
  - ' '
  - <dark_gray><strikethrough>----------------------------------------------</dark_gray><reset>
  
  # Team-based summary for a single game
  mini_game_team:
  - <dark_gray><strikethrough>----------------------------------------------</dark_gray><reset>
  - ' '
  - '  <green>Winning team:</green> <yellow>{team_winners}</yellow>'
  - '  <gray>Your team:</gray> <white>{team_player}</white> <gray>({team_player_count}/{team_size})</gray>'
  - ' '
  - '  <gold>⛁</gold> <yellow>{credits_earned}  <gray>|</gray>  <gold>✹</gold> <gold>{xp_earned}</gold>  <gray>|</gray>  <gold>✯</gold> <yellow>{stars_earned}</yellow>'
  - ' '
  - <dark_gray><strikethrough>----------------------------------------------</dark_gray><reset>
  
  # Final results across all rounds
  final:
  - <dark_gray><strikethrough>----------------------------------------------</dark_gray><reset>
  - ' '
  - '  <yellow><bold>PARTY <gold>GAMES</gold></bold> <gray>-</gray> <yellow>End of Game <gray>-</gray> <green>Results:</green>'
  - ' '
  - '     <green>➊ <bold>{place_1_stars}</green>'
  - '     <gold>➋ <bold>{place_2_stars}</gold>'
  - '     <red>➌ <bold>{place_3_stars}</red>'
  - ' '
  - '  <gold>⛁</gold> <yellow>{credits_earned}  <gray>|</gray>  <gold>✹</gold> <gold>{xp_earned}</gold>  <gray>|</gray>  <gold>✯</gold> <yellow>{stars_earned}  <gray>|</gray>  <green>You placed:</green> <gold>{place_player}</gold>'
  - ' '
  - <dark_gray><strikethrough>----------------------------------------------</dark_gray><reset>
  
  # Final summary for standalone team games
  final_team:
  - <dark_gray><strikethrough>----------------------------------------------</dark_gray><reset>
  - ' '
  - '  <yellow><bold>PARTY <gold>GAMES</gold></bold> <gray>-</gray> <yellow>Team Results</yellow>'
  - ' '
  - '  <green>Winning team:</green> <yellow>{team_winners}</yellow>'
  - '  <gray>Your team:</gray> <white>{team_player}</white> <gray>({team_player_count}/{team_size})</gray>'
  - ' '
  - '  <gold>⛁</gold> <yellow>{credits_earned}  <gray>|</gray>  <gold>✹</gold> <gold>{xp_earned}</gold>  <gray>|</gray>  <gold>✯</gold> <yellow>{stars_earned}</yellow>'
  - ' '
  - <dark_gray><strikethrough>----------------------------------------------</dark_gray><reset>
  
  stats:
    java:
      header:
      - <dark_gray><strikethrough>----------------------------------------------</dark_gray><reset>
      - ' '
      - '  <yellow><bold>PARTY <gold>GAMES</gold></bold> <gray>-</gray> <yellow>Stats Progress</yellow>'
      - ' '
      entry: '    <gray>• {stat}</gray> <white>+{delta}</white> <dark_gray>(Total: {total})'
      module_entry: '    <gray>•</gray> <yellow>[{module}]</yellow> <white>{stat}</white> <green>+{delta}</green> <dark_gray>(Total: {total})'
      footer:
      - ' '
      - <dark_gray><strikethrough>----------------------------------------------</dark_gray><reset>
    bedrock:
      title: Stat progress
      content_header: 'Stats gained this match:'
      entry: '• {stat}: +{delta} (Total: {total})'
      empty: No new stats this round.
      buttons:
        play_again: Play again
        lobby: Return to Lobby
    invalid_period: '{prefix} <yellow>Invalid summary stats period ''{period}''. Using all-time.</yellow>'

# ----------------------------------------
# Economy
# ----------------------------------------
economy:
  errors:
    invalid_provider: '{prefix} <red>Invalid economy provider ''{provider}''. Falling back to built-in credits.</red>'
    vault_missing: '{prefix} <red>Vault is enabled in settings, but no economy provider was found. Falling back to built-in credits.</red>'
    custom_missing_config: '{prefix} <red>Custom economy is enabled but configuration is incomplete. Check that give_command, take_command, and get_placeholder are all set in settings.yml. Credits operations will fail until custom economy is fully configured.</red>'
    custom_papi_missing: '{prefix} <red>Custom economy requires PlaceholderAPI to read balances. Balance checks will return 0 until PlaceholderAPI is installed.</red>'

stats:
  periods:
    alltime: All-time
    monthly: Monthly
    yearly: Yearly
  periods_list: alltime, monthly, yearly
  labels:
    global: Global
    wins: Wins
    games_played: Games Played
    mini_games_played: Mini games played
    first_place: First Places
    second_place: Second Places
    third_place: Third Places
    stars: Stars
    credits: Credits
    kills: Kills
    deaths: Deaths
    current_win_streak: Current Win Streak
    best_win_streak: Best Win Streak
    time_played: Time Played
    modules: {}

# ----------------------------------------
# Plugin Info
# ----------------------------------------
plugin_info:
- <dark_gray><strikethrough>--------------------------</dark_gray><reset>
- ' '
- <bold><gradient:#4CADD0:#B2F9FF>TheySix Events</gradient> <gray>-</gray> <yellow>{plugin_version}</yellow>
- <gray>Created by TheySix (events.theysix.tech)</gray>
- ' '
- <gray>Use</gray> <gold>/ts help</gold> <gray>to get help.</gray>
- ' '
- <dark_gray><strikethrough>--------------------------</dark_gray><reset>

# ========================================
# ADMINISTRATOR EXPERIENCE
# ========================================

# ----------------------------------------
# Admin Messages (Commands & Management)
# ----------------------------------------
admin_commands:
  
  # ====================================
  # Magic Stick (Selection Tool)
  # ====================================
  stick:
    given: '{prefix} <green>Magic Stick obtained! Left click = pos1, Right click = pos2</green>'
    already_have: '{prefix} <yellow>You already have the Magic Stick in your inventory.</yellow>'
    pos1_set: '{prefix} <green>Position 1 set at X:{x}, Y:{y}, Z:{z}</green>'
    pos2_set: '{prefix} <green>Position 2 set at X:{x}, Y:{y}, Z:{z}</green>'
    selection_cleared: '{prefix} <yellow>Selection cleared.</yellow>'
    no_selection: '{prefix} <red>You don''t have an active selection. Use the Magic Stick first.</red>'
    incomplete_selection: '{prefix} <red>Incomplete selection. Set both positions with the Magic Stick.</red>'
    different_worlds: '{prefix} <red>Both positions must be in the same world.</red>'
    selection_info: '{prefix} <gray>Selection: {blocks} blocks ({x}×{y}×{z})</gray>'
  
  # ====================================
  # Arena CRUD Operations
  # ====================================
  create:
    success: '{prefix} <green>Arena {arena_id} created successfully in {mode} mode.</green>'
    already_exists: '{prefix} <red>Arena {arena_id} already exists.</red>'
    invalid_mode: '{prefix} <red>Invalid mode. Use ''standalone'' or ''party''.</red>'
  
  delete:
    success: '{prefix} <green>Arena {arena_id} deleted successfully.</green>'
    not_found: '{prefix} <red>Arena {arena_id} does not exist.</red>'
    confirm: '{prefix} <yellow>Type ''/tsa delete {arena_id} confirm'' to confirm deletion.</yellow>'
  
  enable:
    success: '{prefix} <green>Arena {arena_id} enabled.</green>'
    already_enabled: '{prefix} <yellow>Arena {arena_id} is already enabled.</yellow>'
    incomplete_config: '{prefix} <red>Cannot enable arena {arena_id}. Complete the configuration first.</red>'
  
  disable:
    success: '{prefix} <green>Arena {arena_id} disabled.</green>'
    already_disabled: '{prefix} <yellow>Arena {arena_id} is already disabled.</yellow>'
  
  list:
    header: '{prefix} <green>Available arenas:</green>'
    item: ' <gray>#{arena_id} - {name} [{mode}] [{status}] - {players}/{max_players}</gray>'
    empty: '{prefix} <yellow>No arenas created yet.</yellow>'
  
  info:
    header: '{prefix} <green>Arena {arena_id} information:</green>'
    name: ' <gray>Name: <white>{name}</white></gray>'
    mode: ' <gray>Mode: <white>{mode}</white></gray>'
    status: ' <gray>Status: <white>{status}</white></gray>'
    players: ' <gray>Players: <white>{min_players}-{max_players}</white></gray>'
    rounds: ' <gray>Rounds: <white>{rounds}</white></gray>'
    games: ' <gray>Minigames: <white>{games}</white></gray>'
    lobby: ' <gray>Lobby: <white>{world} ({x}, {y}, {z})</white></gray>'
    not_configured: ' <red>Not configured yet</red>'
  
  # ====================================
  # Credits
  # ====================================
  credits:
    given: '{prefix} <green>Gave {amount} credits to {player} ({provider}).</green>'
    player_not_found: '{prefix} <red>Player ''{player}'' not found.</red>'
    invalid_amount: '{prefix} <red>Invalid credits amount: {amount}</red>'
    provider_unavailable: '{prefix} <red>Credits provider "{provider}" is not available right now.</red>'
  
  # ====================================
  # Experience
  # ====================================
  xp:
    given: '{prefix} <green>Gave {amount} XP to {player}.</green>'
    player_not_found: '{prefix} <red>Player ''{player}'' not found.</red>'
    invalid_amount: '{prefix} <red>Invalid XP amount: {amount}</red>'
    disabled: '{prefix} <red>The levels system is currently disabled.</red>'
  
  # ====================================
  # Lobby Configuration
  # ====================================

  lobby:
    set_main:
      success: '{prefix} <green>Main lobby set at X:{ml_x}, Y:{ml_y}, Z:{ml_z} in world {ml_world}</green>'
    
    create:
      success: '{prefix} <green>Lobby ''{lobby_id}'' created successfully.</green>'
      already_exists: '{prefix} <red>Lobby ''{lobby_id}'' already exists.</red>'
    
    delete:
      success: '{prefix} <green>Lobby ''{lobby_id}'' deleted successfully.</green>'
      not_found: '{prefix} <red>Lobby ''{lobby_id}'' does not exist.</red>'
      confirm: '{prefix} <yellow>Type ''/tsa lobby delete {lobby_id} confirm'' to confirm deletion.</yellow>'
    
    list:
      header: '{prefix} <green>Available lobbies:</green>'
      item: ' <gray>- {lobby_id} ({world} at {x}, {y}, {z})</gray>'
      empty: '{prefix} <yellow>No lobbies configured yet.</yellow>'
    
    info:
      header: '{prefix} <green>Lobby ''{lobby_id}'' information:</green>'
      world: ' <gray>World: <white>{world}</white></gray>'
      location: ' <gray>Location: <white>{x}, {y}, {z}</white></gray>'
      restrictions: ' <gray>Restrictions: <white>{restrictions}</white></gray>'
      not_found: '{prefix} <red>Lobby ''{lobby_id}'' does not exist.</red>'
    
    teleport:
      success: '{prefix} <green>Teleported {player} to lobby ''{lobby_id}''.</green>'
      player_not_found: '{prefix} <red>Player ''{player}'' not found.</red>'
    
    reload:
      success: '{prefix} <green>Lobbies reloaded successfully.</green>'
  
  # ====================================
  # Arena Configuration
  # ====================================
  arena:
    setlobby:
      success: '{prefix} <green>Waiting lobby set at X:{x}, Y:{y}, Z:{z}</green>'
    
    setname:
      success: '{prefix} <green>Arena name set to: {name}</green>'
      invalid_colors: '{prefix} <red>Invalid color codes in name.</red>'
    
    setmode:
      success: '{prefix} <green>Arena mode changed to: {mode}</green>'
      invalid_mode: '{prefix} <red>Invalid mode. Use ''standalone'' or ''party''.</red>'
      has_multiple_games: '{prefix} <red>Cannot change to standalone mode. This arena has multiple minigames configured. Remove them first.</red>'
      standalone_warning: '{prefix} <yellow>Arena changed to standalone mode. You can only configure 1 minigame.</yellow>'
      party_warning: '{prefix} <yellow>Arena changed to party mode. Configure at least 3 minigames and set rounds.</yellow>'
    
    setrounds:
      success: '{prefix} <green>Number of rounds set to: {rounds}</green>'
      invalid_range: '{prefix} <red>Rounds must be between 3 and 15.</red>'
      standalone_warning: '{prefix} <yellow>Rounds are mainly designed for party mode. In standalone mode, the same minigame will repeat {rounds} times.</yellow>'
    
    minplayers:
      success: '{prefix} <green>Minimum players set to: {amount}</green>'
      invalid_range: '{prefix} <red>Amount must be between 2 and 64.</red>'
      greater_than_max: '{prefix} <red>Minimum players cannot be greater than maximum players.</red>'
    
    maxplayers:
      success: '{prefix} <green>Maximum players set to: {amount}</green>'
      invalid_range: '{prefix} <red>Amount must be between 2 and 64.</red>'
      less_than_min: '{prefix} <red>Maximum players cannot be less than minimum players.</red>'
  
  # ====================================
  # Minigame Management
  # ====================================
  game:
    add:
      success: '{prefix} <green>Minigame {game} added to arena {arena_id}.</green>'
      already_exists: '{prefix} <red>This minigame is already configured in this arena.</red>'
      registered: '{prefix} <yellow>Minigame registered. Now configure it with game commands.</yellow>'
      standalone_limit: '{prefix} <red>Standalone arenas can only have 1 minigame. Remove the existing one first or change to party mode.</red>'
      standalone_micro_warning: '{prefix} <yellow>{game} is a micro-game designed for party mode, but it can still be used in standalone.</yellow>'
      party_mini_warning: '{prefix} <yellow>{game} is a minigame designed for standalone, but it can still be used in party mode.</yellow>'
      list_header: '{prefix} <green>Available {type} games:</green>'
      list_item: ' <gray>- {game}</gray>'
      list_empty: '{prefix} <yellow>No {type} games are currently available.</yellow>'
    
    remove:
      success: '{prefix} <green>Minigame {game} removed from arena {arena_id}.</green>'
      not_found: '{prefix} <red>This minigame is not configured in this arena.</red>'
      confirm: '{prefix} <yellow>Type ''/tsa game {arena_id} remove {game} confirm'' to confirm.</yellow>'
    
    list:
      header: '{prefix} <green>Minigames in arena {arena_id}:</green>'
      item: ' <gray>- {game} [{status}] - {type}</gray>'
      empty: '{prefix} <yellow>No minigames configured yet.</yellow>'
    
    enable:
      success: '{prefix} <green>Minigame {game} enabled.</green>'
      incomplete_config: '{prefix} <red>Cannot enable {game}. Complete its configuration first.</red>'
    
    disable:
      success: '{prefix} <green>Minigame {game} disabled.</green>'
    
    # Common minigame configuration
    bounds:
      set_success: '{prefix} <green>Bounds set for {game}: {blocks} blocks ({x}×{y}×{z})</green>'
      must_use_stick: '{prefix} <red>Use the Magic Stick to select an area first.</red>'
    
    spawn:
      add_success: '{prefix} <green>Spawn #{number} added at X:{x}, Y:{y}, Z:{z}</green>'
      remove_success: '{prefix} <green>Spawn #{number} removed.</green>'
      remove_not_found: '{prefix} <red>Spawn #{number} does not exist.</red>'
      teleport_success: '{prefix} <green>Teleported to spawn #{number}.</green>'
      list_header: '{prefix} <green>Spawns for {game} in arena {arena_id}:</green>'
      list_item: ' <gray>#{number}: X:{x}, Y:{y}, Z:{z}</gray>'
      list_empty: '{prefix} <yellow>No spawns configured yet.</yellow>'
      need_bounds: '{prefix} <red>Set the bounds before adding spawns.</red>'
      min_spawns_warning: '{prefix} <yellow>Add at least {min_spawns} spawns (current: {current}).</yellow>'
    
    time:
      success: '{prefix} <green>Game duration set to {minutes} minutes.</green>'
      invalid: '{prefix} <red>Time must be between 1 and 60 minutes.</red>'
    
    deathblock:
      success: '{prefix} <green>Death block set to: {material}</green>'
      invalid_material: '{prefix} <red>Invalid material: {material}</red>'
  
  # ====================================
  # Module Management
  # ====================================
  module:
    list:
      minigames:
        header: '{prefix} <green>Available minigame modules:</green>'
        empty: '{prefix} <yellow>No minigame modules found.</yellow>'
      microgames:
        header: '{prefix} <green>Available microgame modules:</green>'
        empty: '{prefix} <yellow>No microgame modules found.</yellow>'
      item: ' <gray>- {name} ({id}) v{version}</gray> <dark_gray>-</dark_gray> {status}'
    info:
      header: '{prefix} <green>Module {module} information:</green>'
      name: ' <gray>Name: <white>{name}</white></gray>'
      version: ' <gray>Version: <white>{version}</white></gray>'
      type: ' <gray>Type: <white>{type}</white></gray>'
      api_version: ' <gray>API Version: <white>{api_version}</white></gray>'
      authors: ' <gray>Authors: <white>{authors}</white></gray>'
      description: ' <gray>Description: <white>{description}</white></gray>'
      website: ' <gray>Website: <white>{website}</white></gray>'
    load:
      success: '{prefix} <green>Module {module} loaded successfully.</green>'
      failed: '{prefix} <red>Failed to load module {module}. Check console for details.</red>'
    reload:
      success: '{prefix} <green>Module {module} reloaded successfully.</green>'
      failed: '{prefix} <red>Failed to reload module {module}. Check console for details.</red>'
    unload:
      success: '{prefix} <green>Module {module} unloaded successfully.</green>'
    delete:
      success: '{prefix} <green>Module {module} deleted successfully.</green>'
      failed: '{prefix} <red>Failed to delete module {module}. Check file permissions.</red>'
      confirm: '{prefix} <yellow>Type ''/tsa module delete {module} confirm'' to confirm deletion.</yellow>'
    store:
      invalid_internal_id: '{prefix} <red>Invalid internal id: {value}</red>'
      invalid_upload: '{prefix} <red>Module {module} is not properly uploaded to the store. Please notify the module developer.</red>'
      search:
        header: '{prefix} <yellow><bold>Store search results</bold></yellow><gray>:</gray>'
        page_info: '{prefix} <gray>Page <white>{page}</white>/<white>{total_pages}</white> <dark_gray>|</dark_gray> Showing <white>{count}</white> of <white>{total}</white></gray>'
        invalid_page: '{prefix} <yellow>Page {page} is out of range. Showing page {safe_page} instead.</yellow>'
        filters: '{prefix} <gray>Filters: {filters}</gray>'
        item: ' <yellow>{name}</yellow> <dark_gray>(id: <white>{id}</white>, page <white>#{resource_id}</white>)</dark_gray> <green>v{version}</green> <gray>|</gray> <gold>{downloads}</gold> <gray>downloads</gray> <gray>|</gray> <gold>{rating}</gold> <gray>rating</gray> <gray>|</gray> <white>{compatibility}</white> <dark_gray>-</dark_gray> <gray>{description}</gray>'
        separator: ' '
        empty: '{prefix} <yellow>No store results found.</yellow>'
        error: '{prefix} <red>Store search failed: {error}</red>'
      download:
        success: '{prefix} <green>Downloaded resource #{resource_id} to {file}.</green>'
        loaded: '{prefix} <green>Module {module} ({id}) is now enabled.</green>'
        load_failed: '{prefix} <red>Downloaded module {module} ({id}) but failed to enable it. Check console for details.</red>'
        failed: '{prefix} <red>Failed to download resource #{resource_id}: {error}</red>'
      update:
        up_to_date: '{prefix} <green>Module {module} is already up to date (v{version}).</green>'
        requires_core: '{prefix} <yellow>Module {module} has updates available, but TheySix Events must be updated to v{core_version} before auto-updating modules.</yellow>'
        arena_in_use: '{prefix} <red>Module {module} is currently running in arenas: {arenas}. Stop them before updating.</red>'
        incompatible_api: '{prefix} <red>Module {module} requires API version {module_api} but the core runs API version {core_api}. Update cancelled.</red>'
        downloaded: '{prefix} <green>Downloaded latest release (v{version}) for resource #{resource_id} to {file}.</green>'
        applied: '{prefix} <green>Module {module} was reloaded to apply the update.</green>'
        apply_failed: '{prefix} <red>Module {module} was updated but failed to reload. Check console for details.</red>'
        failed: '{prefix} <red>Failed to update resource #{resource_id}: {error}</red>'
    not_loaded: '{prefix} <red>Module {module} is not loaded.</red>'
    already_loaded: '{prefix} <yellow>Module {module} is already loaded.</yellow>'
  
  # ====================================
  # Signs Management
  # ====================================
  signs:
    deprecated: '{prefix} <yellow>Sign text creation is deprecated. Use /tsa signs set instead.</yellow>'
    create:
      join_mode: '{prefix} <yellow>Click on an empty sign to create a JOIN sign for arena {arena_id}.</yellow>'
      join_mode_info: '{prefix} <gray>Left click the sign within 30 seconds or type ''cancel'' to abort.</gray>'
      quickjoin_mode: '{prefix} <yellow>Click on an empty sign to create a QUICKJOIN sign.</yellow>'
      quickjoin_mode_info: '{prefix} <gray>Left click the sign within 30 seconds or type ''cancel'' to abort.</gray>'
      success: '{prefix} <green>Sign created successfully at X:{s_x}, Y:{s_y}, Z:{s_z}</green>'
      cancelled: '{prefix} <yellow>Sign creation cancelled.</yellow>'
      timeout: '{prefix} <red>Sign creation timed out. Try again.</red>'
      not_sign: '{prefix} <red>You must click on a sign block (OAK_SIGN or OAK_WALL_SIGN).</red>'
      already_registered: '{prefix} <red>This sign is already registered.</red>'
    set:
      not_sign: '{prefix} <red>You must be looking at an empty sign (OAK_SIGN or OAK_WALL_SIGN).</red>'
      not_empty: '{prefix} <red>This sign is not empty.</red>'
      already_registered: '{prefix} <red>This sign is already registered.</red>'
      invalid_type: '{prefix} <red>Unknown sign type: {type}. Use join, quickjoin, auto, or top.</red>'
      invalid_arena: '{prefix} <red>Invalid arena id: {arena_id}.</red>'
      invalid_server: '{prefix} <red>Unknown bungee server: {server}.</red>'
      invalid_position: '{prefix} <red>Invalid top position: {position}. Use a number greater than 0.</red>'
      invalid_stat: '{prefix} <red>Unknown stat: {stat_input}.</red>'
      ambiguous_stat: '{prefix} <red>That stat exists in multiple modules.</red> <yellow>Use module:stat.</yellow> <gray>{modules}</gray>'
      invalid_period: '{prefix} <red>Invalid period: {period}. Use {valid_periods}.</red>'
      failed: '{prefix} <red>Failed to register the sign. Check console for details.</red>'
    
    remove:
      mode: '{prefix} <yellow>Click on a registered sign to remove it.</yellow>'
      mode_info: '{prefix} <gray>Left click the sign within 30 seconds or type ''cancel'' to abort.</gray>'
      success: '{prefix} <green>Sign removed successfully at X:{s_x}, Y:{s_y}, Z:{s_z}</green>'
      not_registered: '{prefix} <red>This sign is not registered.</red>'
      cancelled: '{prefix} <yellow>Sign removal cancelled.</yellow>'
      timeout: '{prefix} <red>Sign removal timed out. Try again.</red>'
    
    list:
      header: '{prefix} <green>Registered signs:</green>'
      item: ' <gray>- {type} | {info} | {world} ({x}, {y}, {z})</gray>'
      empty: '{prefix} <yellow>No signs registered yet.</yellow>'
  
  # ====================================
  # Global Configuration
  # ====================================
  setmainlobby:
    success: '{prefix} <green>Main lobby set at X:{x}, Y:{y}, Z:{z} in world {world}</green>'
  
  reload:
    reloading: '{prefix} <yellow>Reloading {file}...</yellow>'
    success: '{prefix} <green>Reloaded {file} successfully.</green>'
    all_success: '{prefix} <green>All files reloaded successfully.</green>'
    error: '{prefix} <red>Error reloading {file}. Check console for details.</red>'
    warning: '{prefix} <yellow>Some configurations may require a server restart to take full effect.</yellow>'
  
  # ====================================
  # Utilities
  # ====================================
  goto:
    success: '{prefix} <green>Teleported to spawn #1 of {game} in arena {arena_id}.</green>'
    no_spawns: '{prefix} <red>No spawns configured for this minigame yet.</red>'
    game_not_configured: '{prefix} <red>Minigame {game} is not configured in arena {arena_id}.</red>'
  
  teleport:
    success: '{prefix} <green>Player {player} teleported to arena {arena_id}.</green>'
    player_not_found: '{prefix} <red>Player {player} not found or is offline.</red>'
    player_in_game: '{prefix} <yellow>Player {player} is currently in a game. They will be removed.</yellow>'
  
  forcestart:
    success: '{prefix} <green>Force starting arena {arena_id}...</green>'
    broadcast: '{prefix} <gold>Arena {arena_id} has been force started by an administrator.</gold>'
    countdown_reduced: '{prefix} <green>Arena {arena_id} countdown reduced to {time} seconds!</green>'
    countdown_reduced_broadcast: '{prefix} <gold>Countdown reduced to {time} seconds by an administrator!</gold>'
    already_reduced: '{prefix} <yellow>Arena {arena_id} countdown is already at {time} seconds or less.</yellow>'
    cannot_start: '{prefix} <red>Cannot force start arena {arena_id}. Status: {status}</red>'
    not_enough_players: '{prefix} <red>At least {min_players} players are required. Current: {current}</red>'
    already_started: '{prefix} <red>Arena {arena_id} has already started.</red>'
    already_starting: '{prefix} <red>Arena {arena_id} is already starting. Please wait.</red>'
  
  forcestop:
    success: '{prefix} <green>Force stopping arena {arena_id}...</green>'
