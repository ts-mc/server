# ========================================
# Sounds
# ========================================

# Customize the sounds that will play throughout the game.
# 
# If you want to disable any sound, leave it empty ("")
# 
# To use official Minecraft sounds, use [SOUND] + a namespaced key. BlueArcade also accepts legacy Bukkit enum names.
# List of sounds: https://hub.spigotmc.org/javadocs/spigot/org/bukkit/Sound.html
# To use note-block music, use [NBS] or [MIDI] + File. Files belong in /plugins/BlueArcade3/sounds and may use subfolders.
# 

music:
  # Changes music tempo without editing the source file. 1.0 keeps its original speed.
  playback_speed: 1.0
