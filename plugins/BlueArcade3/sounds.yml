# ========================================
# Sounds
# ========================================

# Customize the sounds that will play throughout the game.
# 
# If you want to disable any sound, leave it empty ("")
# 
# To use official Minecraft sounds, use [SOUND] + Sound. List of sounds: https://hub.spigotmc.org/javadocs/spigot/org/bukkit/Sound.html
# To use NBS musical notes, use [NBS] + File. The file must be in /plugins/BlueArcade/sounds and can include subfolders (Requires NoteBlockAPI)
# 

sounds:

  # Sounds in the waiting lobby
  waiting_lobby:

    # Sound when a vote is cast
    vote_game: "[SOUND] minecraft:entity.item.pickup"

  # Sounds at the start of the arena.
  starting_arena:

    # Sound for each second of the counter.
    countdown: ""

    # Sound for when the counter is notified how much is left (configured in settings.yml).
    notify_countdown: "[SOUND] minecraft:entity.item.pickup"

  # Sounds when starting a game
  starting_game:

    # Sound when teleporting players to a game.
    teleport: "[SOUND] minecraft:entity.enderman.teleport"

    # Sound for each second of the counter.
    countdown: "[SOUND] minecraft:entity.chicken.egg"

    # Sound when the game starts.
    start: "[SOUND] minecraft:entity.player.levelup"

  # Sounds for when the arena is in game.
  in_game:

    # Sound for when a player is classified.
    classified: "[SOUND] minecraft:entity.experience_orb.pickup"

    # Sound for when a player finishes a mini-game but is not classified.
    finish: "[SOUND] minecraft:entity.experience_orb.pickup"

    # Sound for when a player dies.
    dead: "[SOUND] minecraft:entity.ender_dragon.hurt"

    # Sound for when a player respawns in a game.
    respawn: "[SOUND] minecraft:entity.enderman.teleport"

    # Sound for when a game is over.
    game_over: "[SOUND] minecraft:entity.wither.death"

    # Sound when a new game is being selected. Only plays if the arena is in party games mode.
    upcoming_game: "[SOUND] minecraft:entity.villager.trade"

    # Sound when a new set is selected. Only plays if the arena is in party games mode.
    next_game: "[NBS] effect/next_game.nbs"

    # Sound when a game is over and the results are displayed.
    finish_game: "[NBS] effect/finish_game.nbs"

  # Sounds for achievements.
  achievements:

    # Sound when an achievement is unlocked.
    unlocked: "[SOUND] minecraft:entity.firework_rocket.blast"
