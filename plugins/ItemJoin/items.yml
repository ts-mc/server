    id: COMPASS
    slot: 0
    name: '&#4CADD0&lT&#5BB7D6&lh&#6AC3DD&le&#79CFE3&ly&#88DBEA&lS&#97E7F0&li&#A6F3F7&lx &#B2F9FF&lE&#A6F3F7&lv&#97E7F0&le&#88DBEA&ln&#79CFE3&lt&#6AC3DD&ls'
