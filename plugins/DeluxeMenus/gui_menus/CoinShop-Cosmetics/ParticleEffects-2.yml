  'ARCANE_FLAME':
    material: 'SOUL_TORCH'
    
    item_flags: 
      - HIDE_ATTRIBUTES
      - HIDE_ADDITIONAL_TOOLTIP
      - HIDE_ENCHANTS
    slot: 10
    display_name: '&#9932CC&lARCANE FLAME &8| %changeoutput_equals_input:{luckperms_has_permission_ultracosmetics.particleeffects.arcaneflame}_matcher:yes_ifmatch:&#A7FC44ᴜɴʟᴏᴄᴋᴇᴅ_else:&#FC4444ʟᴏᴄᴋᴇᴅ%'
    lore:
    - '&8ᴇꜰꜰᴇᴄᴛ'
    - ''
    - '&#9932CC• &#FFEFC5ʀᴀɴɢᴏ: &#7ecd0e&lᴠɪᴘ'
    - ''
    - '&#9932CC| &#FFEFC5ᴏʙᴛᴇɴ ᴍᴏɴᴇᴅᴀꜱ ᴇɴ'
    - '&#9932CC| &#FFEFC5ᴛɪᴇɴᴅᴀ &#FF4141ꜱᴛᴏʀᴇ.ᴘɪxᴇʟꜱᴛᴜᴅɪᴏꜱ.ʟᴀᴛ '
    - ''
    - '%changeoutput_equals_input:{luckperms_has_permission_ultracosmetics.particleeffects.arcaneflame}_matcher:yes_ifmatch:&#9932CC➥ ᴄʟɪᴄ ᴅᴇʀᴇᴄʜᴏ ᴘᴀʀᴀ ᴇQᴜɪᴘᴀʀ_else:&#9932CC➥ ʜᴀᴢ ᴄʟɪᴄ ᴘᴀʀᴀ ᴄᴏᴍᴘʀᴀʀ%'
    left_click_requirement:
      minimum_requirements: 2
      requirements:
        already:
          type: "!has permission"
          permission: "ultracosmetics.particleeffects.arcaneflame"
          deny_commands:
          - '[sound] ENTITY_VILLAGER_NO'
          - '[message]&8[&#FFDB40&lCOIN SHOP&8] &#FC4444ʏᴀ ᴛɪᴇɴᴇꜱ ᴇꜱᴛᴏ effect unlocked!'
          - '[message]&8[&#FFDB40&lCOIN SHOP&8] &#FFEFC5ᴄʟɪᴄ ᴅᴇʀᴇᴄʜᴏ ᴘᴀʀᴀ ᴇQᴜɪᴘᴀʀ this effect!'
        anything_here:
          type: '>='
          input: '%playerpoints_points%'
          output: '300'
          deny_commands:
          - '[sound] ENTITY_VILLAGER_NO'
          - '[message]&8[&#FFDB40&lCOIN SHOP&8] &#FC4444You don''t have enough coins for this!'
          - '[message]&8[&#FFDB40&lCOIN SHOP&8] &#FFEFC5ᴄᴏᴍᴘʀᴀ ᴍᴏɴᴇᴅᴀꜱ ᴇɴ &#FFDF55ꜱᴛᴏʀᴇ.ᴘɪxᴇʟꜱᴛᴜᴅɪᴏꜱ.ʟᴀᴛ &#FFEFC5!'
    right_click_requirement:
      requirements:
        check_permission:
          type: "has permission"
          permission: "ultracosmetics.particleeffects.arcaneflame"
          deny_commands:
          - '[sound] ENTITY_VILLAGER_NO'
          - '[message]&8[&#FFDB40&lCOIN SHOP&8] &#FC4444You don''t have this effect unlocked!'
    left_click_commands:
    - '[console] lp user %player_name% permission set ultracosmetics.particleeffects.arcaneflame true'
    - '[console] points take %player_name% 300'
    - '[sound] ENTITY_PLAYER_LEVELUP'
    - '[message]&8[&#FFDB40&lCOIN SHOP&8] &#FFEFC5You have successfully purchased the &#9932CC&lARCANE FLAME &#FFEFC5effect!'
    - '[message]&8[&#FFDB40&lCOIN SHOP&8] &#FFEFC5You can Right-Click on it to equip!'
    - '[close]'
    right_click_commands:
    - '[player] uc toggle effects arcaneflame'
    - '[sound] ENTITY_EXPERIENCE_ORB_PICKUP'

