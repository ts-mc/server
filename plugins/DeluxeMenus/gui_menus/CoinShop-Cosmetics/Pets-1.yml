    - ''
    - '%changeoutput_equals_input:{luckperms_has_permission_ultracosmetics.pets.frog}_matcher:yes_ifmatch:&#A1C865➥ ᴄʟɪᴄ ᴅᴇʀᴇᴄʜᴏ ᴘᴀʀᴀ ᴇQᴜɪᴘᴀʀ_else:&#A1C865➥ ʜᴀᴢ ᴄʟɪᴄ ᴘᴀʀᴀ ᴄᴏᴍᴘʀᴀʀ%'
