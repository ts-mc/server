      minimum_requirements: 2
      requirements:
        already:
          type: "!has permission"
          permission: "ultracosmetics.pets.frog"
          deny_commands:
          - '[sound] ENTITY_VILLAGER_NO'
          - '[message]&8[&#FFDB40&lCOIN SHOP&8] &#FC4444ʏᴀ ᴛɪᴇɴᴇꜱ ᴇꜱᴛᴏ pet unlocked!'
