        anything_here:
          type: '>='
          input: '%playerpoints_points%'
          output: '300'
          deny_commands:
          - '[sound] ENTITY_VILLAGER_NO'
          - '[message]&8[&#FFDB40&lCOIN SHOP&8] &#FC4444You don''t have enough coins for this!'
          - '[message]&8[&#FFDB40&lCOIN SHOP&8] &#FFEFC5purchase Coins at &#FFDF55ꜱᴛᴏʀᴇ.ᴘɪxᴇʟꜱᴛᴜᴅɪᴏꜱ.ʟᴀᴛ &#FFEFC5!'
