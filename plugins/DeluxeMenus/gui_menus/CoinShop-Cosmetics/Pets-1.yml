      requirements:
        check_permission:
          type: "has permission"
          permission: "ultracosmetics.pets.frog"
          deny_commands:
          - '[sound] ENTITY_VILLAGER_NO'
          - '[message]&8[&#FFDB40&lCOIN SHOP&8] &#FC4444You don''t have this pet unlocked!'
    left_click_commands:
    - '[console] lp user %player_name% permission set ultracosmetics.pets.frog true'
    - '[console] points take %player_name% 300'
    - '[sound] ENTITY_PLAYER_LEVELUP'
    - '[message]&8[&#FFDB40&lCOIN SHOP&8] &#FFEFC5You have successfully purchased the &#A1C865&lFROG &#FFEFC5pet!'
    - '[message]&8[&#FFDB40&lCOIN SHOP&8] &#FFEFC5You can Right-Click on it to equip!'
    - '[close]'
