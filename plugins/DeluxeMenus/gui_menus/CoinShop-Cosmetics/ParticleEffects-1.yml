    - '&8ᴇꜰꜰᴇᴄᴛ'
    - ''
    - '&#A8FFFF• &#FFEFC5ʀᴀɴɢᴏ: &#7ecd0e&lᴠɪᴘ'
    - ''
    - '&#A8FFFF| &#FFEFC5ᴏʙᴛᴇɴ ᴍᴏɴᴇᴅᴀꜱ ᴇɴ'
    - '&#A8FFFF| &#FFEFC5ᴛɪᴇɴᴅᴀ &#FF4141ꜱᴛᴏʀᴇ.ᴘɪxᴇʟꜱᴛᴜᴅɪᴏꜱ.ʟᴀᴛ '
    - ''
    - '%changeoutput_equals_input:{luckperms_has_permission_ultracosmetics.particleeffects.snowcloud}_matcher:yes_ifmatch:&#A8FFFF➥ ᴄʟɪᴄ ᴅᴇʀᴇᴄʜᴏ ᴘᴀʀᴀ ᴇQᴜɪᴘᴀʀ_else:&#A8FFFF➥ ʜᴀᴢ ᴄʟɪᴄ ᴘᴀʀᴀ ᴄᴏᴍᴘʀᴀʀ%'
    left_click_requirement:
      minimum_requirements: 2
      requirements:
        already:
          type: "!has permission"
          permission: "ultracosmetics.particleeffects.snowcloud"
          deny_commands:
          - '[sound] ENTITY_VILLAGER_NO'
          - '[message]&8[&#FFDB40&lCOIN SHOP&8] &#FC4444ʏᴀ ᴛɪᴇɴᴇꜱ ᴇꜱᴛᴏ effect unlocked!'
          - '[message]&8[&#FFDB40&lCOIN SHOP&8] &#FFEFC5ᴄʟɪᴄ ᴅᴇʀᴇᴄʜᴏ ᴘᴀʀᴀ ᴇQᴜɪᴘᴀʀ this effect!'
        anything_here:
          type: '>='
          input: '%playerpoints_points%'
          output: '300'
          deny_commands:
          - '[sound] ENTITY_VILLAGER_NO'
          - '[message]&8[&#FFDB40&lCOIN SHOP&8] &#FC4444You don''t have enough coins for this!'
          - '[message]&8[&#FFDB40&lCOIN SHOP&8] &#FFEFC5ᴄᴏᴍᴘʀᴀ ᴍᴏɴᴇᴅᴀꜱ ᴇɴ &#FFDF55ꜱᴛᴏʀᴇ.ᴘɪxᴇʟꜱᴛᴜᴅɪᴏꜱ.ʟᴀᴛ &#FFEFC5!'
    right_click_requirement:
      requirements:
        check_permission:
          type: "has permission"
          permission: "ultracosmetics.particleeffects.snowcloud"
          deny_commands:
          - '[sound] ENTITY_VILLAGER_NO'
          - '[message]&8[&#FFDB40&lCOIN SHOP&8] &#FC4444You don''t have this effect unlocked!'
    left_click_commands:
    - '[console] lp user %player_name% permission set ultracosmetics.particleeffects.snowcloud true'
    - '[console] points take %player_name% 300'
    - '[sound] ENTITY_PLAYER_LEVELUP'
    - '[message]&8[&#FFDB40&lCOIN SHOP&8] &#FFEFC5You have successfully purchased the &#A8FFFF&lSNOW CLOUD &#FFEFC5effect!'
    - '[message]&8[&#FFDB40&lCOIN SHOP&8] &#FFEFC5You can Right-Click on it to equip!'
    - '[close]'
    right_click_commands:
    - '[player] uc toggle effects snowcloud'
    - '[sound] ENTITY_EXPERIENCE_ORB_PICKUP'

