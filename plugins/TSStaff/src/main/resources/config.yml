# ==============================================================
# TSStaff - TheySix Events staff tools
# Also: chat anti-spam (cooldown, repeats, flood auto-mute, caps)
# Commands: /clearchat  /mutechat  /unmutechat  /freeze <player>
#           /unfreeze <player>  /announce <message>  /tsstaff reload  /update
# Colour codes use &  (e.g. &b pink, &b aqua, &l bold)
# ==============================================================
prefix: '&bTSStaff &7| &r'

clearchat:
  lines: 150 # blank lines sent to clear the chat

freeze:
  title: '&b&lFROZEN'
  subtitle: '&fDon''t log out. Staff will speak to you.'
  reminder-seconds: 5 # how often the title shows again while frozen
  sound: minecraft:block.glass.break
  invulnerable: true # frozen players can't take or deal damage
  allowed-commands: # commands a frozen player can still use
    - msg
    - tell
    - w
    - r
    - reply
    - discord
  on-logout-commands: []

announce:
  format:
  - ' '
  - '&b&lANNOUNCEMENT &8» &f%message%'
  - ' '
  title: '&b&lANNOUNCEMENT' # set to "" for no title
  message-as-subtitle: true
  sound: minecraft:block.note_block.pling # set to "" for no sound

antispam:
  enabled: true # bypass: tsstaff.antispam.bypass (manager + owner)
  cooldown-seconds: 1.5 # minimum time between two messages
  block-duplicates: true # block sending the same message again
  duplicate-seconds: 30
  burst: # more than max-messages within seconds = auto mute
    max-messages: 4
    seconds: 6
    mute-seconds: 30
  caps: # long ALL-CAPS messages are turned into lowercase
    enabled: true
    min-length: 8
    max-percent: 70

# /update checks every loaded plugin. A missing source is shown for manual review.
