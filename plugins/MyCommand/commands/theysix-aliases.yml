#-------------------------------------------------------------------------------------------------------------------#
#  TheySix Events — /ts and /tse command aliases
#
#  PURPOSE
#  The TheySix Events core (BlueArcade3) declares its player command as
#  /arcade with aliases [ba, barcade, bluearcade], and its admin command as
#  /arcadeadmin with aliases [baa, barcadea, bluearcadeadmin].
#
#  The /ba alias is hardcoded inside ~15 compiled classes in the core jar
#  (menus, signs, item actions, command blocker), so it CANNOT be changed from
#  config. Rather than patch the jar, these MyCommand entries add a friendlier
#  /ts (and /tse) that forwards to the existing /ba commands.
#
#  Players typing /ts get TheySix Events branding; GUI items, signs and menus
#  keep working because they still call /ba internally, and both resolve to the
#  same command.
#
#  WHY MYCOMMAND
#  Paper's commands.yml can only remap a command that already exists, and no
#  installed plugin declares /ts — so there is nothing for commands.yml to
#  alias. MyCommand can register a brand-new command, which is what we need.
#
#  REQUIREMENTS
#  - MyCommand jar present and enabled (plugins/MyCommand-v5.7.4.jar).
#  - Reload with /mycmd-reload (or restart) after editing.
#
#  NOTE ON ARGUMENTS
#  Argument pass-through uses MyCommand's $multiargs variable, which expands to
#  everything typed after the command ("/ts join PG-01" -> "/ba join PG-01").
#  A bare "$args" does NOT work in runcmd — MyCommand only substitutes the
#  positional $arg1/$arg2/... or the combined $multiargs. Verified live: with
#  "$args" the literal text was forwarded to /ba (2026-10-18).
#-------------------------------------------------------------------------------------------------------------------#

# ---------------------------------------------------------------------------
# /ts — player command alias
# ---------------------------------------------------------------------------
tse_player:
  command: /ts
  type: RUN_COMMAND
  register: true
  permission-required: false
  runcmd:
    # $multiargs forwards everything after "/ts" to "/ba".
    # "/ts" alone      -> "/ba"        (opens the join GUI)
    # "/ts join PG-01" -> "/ba join PG-01"
    - /ba $multiargs
  # Shown in tab-completion while typing /ts
  tab_completer:
    - join
    - quickjoin
    - leave
    - vote
    - team
    - stats
    - tops
    - achievements
    - level
    - store
    - credits
    - party

# ---------------------------------------------------------------------------
# /tse — longer-form spelling of the same alias
# ---------------------------------------------------------------------------
tse_player_long:
  command: /tse
  type: RUN_COMMAND
  register: true
  permission-required: false
  runcmd:
    - /ba $multiargs
  tab_completer:
    - join
    - quickjoin
    - leave
    - vote
    - team
    - stats
    - tops
    - achievements
    - level
    - store
    - credits
    - party

# ---------------------------------------------------------------------------
# /tsa — admin alias (mirrors the /baa admin command)
#
# Locked behind the admin permission so regular players cannot see or use it.
# ---------------------------------------------------------------------------
tse_admin:
  command: /tsa
  type: RUN_COMMAND
  register: true
  permission-required: true
  permission-node: theysixevents.admin
  permission-error: '&8[&c&l!&8] &cYou do not have permission to use that command.'
  runcmd:
    - /baa $multiargs
  tab_completer:
    - help
    - arena
    - module
    - reload
    - forcestop