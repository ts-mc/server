horror-version: 1

capacity: 300

progression-version: 5

# Prepared assets and reports, relative to plugins/TSEvent. The main-server bundle uses assets.

storage-root: assets

integration:
  
  force-event-lobby-on-join: false

minimum-players: 2

countdown-seconds: 30

loot-grace-seconds: 120

stage-seconds: 120

refill-seconds: 240

lobby:
  
  world: event_lobby
  
  spawn:
  - -300.326
  - 216.0
  - -261.219
  - 179.09
  - -0.45
  
  rescue-y: 195.0

arena:
  
  world: event_arena
  
  bounds:
  - -1088
  - -608
  - -160
  - 192
  
  spawn-separation: 5.0
  
  loot-spacing: 12
  
  chest-target: 200
  
  starting-blocks: 32

performance:
  
  # Experimental safety ceilings, not a certified 300-player benchmark.

  max-zombies: 100
  
  local-zombie-cap: 24
  
  spawns-per-tick: 2
  
  spawn-interval-ticks: 5
  
  targets-per-tick: 16
  
  breaks-per-tick: 4
  
  preparation-ms-per-tick: 6
  
  chest-updates-per-tick: 8
  
  deployment-per-tick: 4
  
  ui-seconds: 1
  
  lag-pause-mspt: 48.0

npc:
  
  skin: MHF_Pumpkin
  
  position:
  - -300.5
  - 215.0
  - -280.5
  - 0.0
  - 0.0

test-mode: false

test-invulnerable-contestants: false

audio:
  
  enabled: true
  
  master-volume: 0.75
  
  max-cues-per-player-second: 8
  
  max-packets-per-tick: 96
  
  # Optional namespaced resource-pack events. Blank uses Minecraft's built-in sound.

  custom-ids:
    
    footstep: ''
    
    growl: ''
    
    block-hit: ''
    
    block-break: ''
    
    zombie-hurt: ''
    
    zombie-death: ''
    
    heartbeat: ''
    
    apparition: tsevent:apparition
    apparition67: tsevent:apparition67
    
    creak: tsevent:creak
    
    whisper: tsevent:whisper

horror:
  
  enabled: true
  
  first-seconds: 180
  
  interval-seconds: 180
  
  light-off-seconds: 10
  
  darkness-base-seconds: 40
  
  darkness-extra-per-level: 20
  
  max-level: 5
  
  radius-per-level: 10
  
  max-light-blocks: 256
  
  changes-per-tick: 16
  
  apparition-lines:
  - I see you…
  - You are trapped here with me…
  - That door will not save you…
  - Do not look behind you…

resource-pack:
  
  required: true
  
  # Set a public HTTPS URL for the hosted server. Loopback works only for local testing.

  url: https://www.curseforge.com/minecraft/shaders/spooklementary
  
  local-server: true
  
  bind: 0.0.0.0
  
  port: 25665

